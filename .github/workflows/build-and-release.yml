name: Build and Release OpenCam

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore src/ScreenRecorder.UI/ScreenRecorder.UI.csproj

    - name: Build and Publish Windows
      run: |
        dotnet publish src/ScreenRecorder.UI/ScreenRecorder.UI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o installer/publish

    - name: Download FFmpeg for Windows
      run: |
        Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
        Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted" -Force
        Copy-Item -Path "ffmpeg_extracted\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe" -Destination "installer/publish/"
        Copy-Item -Path "ffmpeg_extracted\ffmpeg-master-latest-win64-gpl\bin\ffprobe.exe" -Destination "installer/publish/"
        
    - name: Create Windows Portable ZIP
      run: |
        Compress-Archive -Path "installer/publish/*" -DestinationPath "OpenCam_Windows_Portable.zip" -Force

    - name: Compile Inno Setup Installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" installer\OpenCam.iss

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OpenCam-Windows-Builds
        path: |
          installer/Output/OpenCam_*_Setup.exe
          OpenCam_Windows_Portable.zip
        
    - name: Create GitHub Release (Windows)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          installer/Output/OpenCam_*_Setup.exe
          OpenCam_Windows_Portable.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build and Publish macOS
      run: |
        dotnet publish src/ScreenRecorder.UI/ScreenRecorder.UI.csproj -c Release -r osx-arm64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/osx-arm64

    - name: Download FFmpeg for macOS (Apple Silicon)
      run: |
        # 獲取適合 macOS 的 FFmpeg 與 FFprobe
        curl -L -o ffmpeg.zip "https://evermeet.cx/ffmpeg/ffmpeg-6.0.zip"
        unzip -o ffmpeg.zip -d publish/osx-arm64/
        curl -L -o ffprobe.zip "https://evermeet.cx/ffmpeg/ffprobe-6.0.zip"
        unzip -o ffprobe.zip -d publish/osx-arm64/
        
    - name: Create macOS App Bundle
      run: |
        mkdir -p OpenCam.app/Contents/MacOS
        mkdir -p OpenCam.app/Contents/Resources
        
        # 複製所有發布檔 (包含 OpenCam、ffmpeg、ffprobe 以及 Avalonia 所需的所有原生 dylib)
        cp -R publish/osx-arm64/* OpenCam.app/Contents/MacOS/
        
        # 確保二進位檔案具備執行權限
        chmod +x OpenCam.app/Contents/MacOS/OpenCam
        if [ -f OpenCam.app/Contents/MacOS/ffmpeg ]; then chmod +x OpenCam.app/Contents/MacOS/ffmpeg; fi
        if [ -f OpenCam.app/Contents/MacOS/ffprobe ]; then chmod +x OpenCam.app/Contents/MacOS/ffprobe; fi
        
        # 複製 App 圖示資源
        if [ -f src/ScreenRecorder.UI/Assets/app_icon.png ]; then
          cp src/ScreenRecorder.UI/Assets/app_icon.png OpenCam.app/Contents/Resources/app_icon.png
        fi
        
        # 建立標準 Info.plist
        cat <<EOF > OpenCam.app/Contents/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>OpenCam</string>
            <key>CFBundleIdentifier</key>
            <string>com.kaoshou.opencam</string>
            <key>CFBundleName</key>
            <string>OpenCam</string>
            <key>CFBundleVersion</key>
            <string>0.1.0</string>
            <key>CFBundleShortVersionString</key>
            <string>0.1.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleSupportedPlatforms</key>
            <array>
                <string>MacOSX</string>
            </array>
            <key>NSMicrophoneUsageDescription</key>
            <string>OpenCam needs microphone access to record audio.</string>
            <key>NSScreenCaptureUsageDescription</key>
            <string>OpenCam needs screen capture access to record your screen.</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
        </dict>
        </plist>
        EOF
        
        # Apple Silicon 必備：使用 Ad-hoc 對整個 App Bundle 與所有內部函式庫進行深度代碼簽名
        codesign --force --deep -s - OpenCam.app

    - name: Create DMG
      run: |
        # 採用 Apple 官方推薦之 srcfolder 方式製作乾淨 UDZO 磁碟映像檔，絕無 attach/detach 快取未同步之壞檔問題
        mkdir -p dmg_staging
        cp -R OpenCam.app dmg_staging/
        ln -s /Applications dmg_staging/Applications
        hdiutil create -volname "OpenCam" -srcfolder dmg_staging -ov -format UDZO OpenCam_macOS_AppleSilicon.dmg
        rm -rf dmg_staging

    - name: Upload macOS DMG as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenCam-macOS-DMG
        path: OpenCam_macOS_AppleSilicon.dmg
        
    - name: Create GitHub Release (macOS)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: OpenCam_macOS_AppleSilicon.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



