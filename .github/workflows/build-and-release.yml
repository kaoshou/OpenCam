# SPDX-License-Identifier: AGPL-3.0-or-later
name: Build and Release OpenCam

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish (leave blank for build only)
        required: false
        type: string
  push:
    branches:
      - 'master'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup Node.js for release notice verification
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Restore Dependencies
      run: dotnet restore src/ScreenRecorder.UI/ScreenRecorder.UI.csproj

    - name: Build and Publish Windows
      run: |
        dotnet publish src/ScreenRecorder.UI/ScreenRecorder.UI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o installer/publish

    - name: Download FFmpeg for Windows
      run: |
        Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
        Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted" -Force
        Copy-Item -Path "ffmpeg_extracted\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe" -Destination "installer/publish/"
        Copy-Item -Path "ffmpeg_extracted\ffmpeg-master-latest-win64-gpl\bin\ffprobe.exe" -Destination "installer/publish/"

    - name: Add project license and corresponding source notice
      run: |
        Copy-Item LICENSE installer/publish/LICENSE
        Copy-Item LICENSE installer/publish/LICENSE.txt
        Copy-Item NOTICE.md installer/publish/NOTICE.md
        @"
        OpenCam 0.2.0
        SPDX-License-Identifier: AGPL-3.0-or-later
        Corresponding source: https://github.com/kaoshou/OpenCam/tree/$env:GITHUB_SHA
        "@ | Set-Content installer/publish/SOURCE.txt -Encoding utf8
        node scripts/check-release-notices.mjs installer/publish $env:GITHUB_SHA 0.2.0 --installer
        
    - name: Create Windows Portable ZIP
      run: |
        Compress-Archive -Path "installer/publish/*" -DestinationPath "OpenCam_Windows_Portable.zip" -Force

    - name: Compile Inno Setup Installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" installer\OpenCam.iss

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OpenCam-Windows-Builds
        path: |
          installer/Output/OpenCam_*_Setup.exe
          OpenCam_Windows_Portable.zip
        
  build-macos:
    runs-on: macos-15
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup Node.js for release notice verification
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Build and Publish macOS
      run: |
        dotnet publish src/ScreenRecorder.UI/ScreenRecorder.UI.csproj -c Release -r osx-arm64 --self-contained true -p:PublishSingleFile=false -o publish/osx-arm64

    - name: Build self-contained FFmpeg for Apple Silicon
      run: |
        chmod +x scripts/build-ffmpeg-macos-arm64.sh
        scripts/build-ffmpeg-macos-arm64.sh publish/osx-arm64
        
    - name: Create macOS App Bundle
      run: |
        chmod +x scripts/package-macos.sh scripts/verify-macos-bundle.sh
        scripts/package-macos.sh publish/osx-arm64 OpenCam.app Release
        node scripts/check-release-notices.mjs OpenCam.app/Contents/Resources "$GITHUB_SHA" 0.2.0

    - name: Create DMG
      run: |
        # hdiutil can transiently report "Resource busy" on hosted runners
        # immediately after signing a large app bundle. Retry the clean
        # srcfolder build and verify the image before publishing it.
        mkdir -p dmg_staging
        cp -R OpenCam.app dmg_staging/
        ln -s /Applications dmg_staging/Applications
        for attempt in 1 2 3; do
          if hdiutil create -volname "OpenCam" -srcfolder "$PWD/dmg_staging" -ov -format UDZO OpenCam_macOS_AppleSilicon.dmg; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            exit 1
          fi
          sleep 5
        done
        hdiutil verify OpenCam_macOS_AppleSilicon.dmg
        rm -rf dmg_staging

    - name: Upload macOS DMG as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenCam-macOS-DMG
        path: OpenCam_macOS_AppleSilicon.dmg
        

  publish-release:
    needs:
      - build-windows
      - build-macos
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
    - name: Download Windows Builds
      uses: actions/download-artifact@v4
      with:
        name: OpenCam-Windows-Builds
        path: release-assets/windows

    - name: Download macOS DMG
      uses: actions/download-artifact@v4
      with:
        name: OpenCam-macOS-DMG
        path: release-assets/macos

    - name: Create or Update GitHub Release
      shell: bash
      run: |
        set -euo pipefail

        if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
        fi

        upload_asset() {
          local asset="$1"
          for attempt in 1 2 3; do
            if gh release upload "$RELEASE_TAG" "$asset" --clobber; then
              return 0
            fi
            if [ "$attempt" -eq 3 ]; then
              return 1
            fi
            sleep $((attempt * 10))
          done
        }

        upload_asset release-assets/windows/installer/Output/OpenCam_*_Setup.exe
        upload_asset release-assets/windows/OpenCam_Windows_Portable.zip
        upload_asset release-assets/macos/OpenCam_macOS_AppleSilicon.dmg
