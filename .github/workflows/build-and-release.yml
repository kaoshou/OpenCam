# SPDX-License-Identifier: AGPL-3.0-or-later
name: Build and Release OpenCam

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish (leave blank for build only)
        required: false
        type: string
  push:
    branches:
      - 'master'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-portable:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Setup Node.js 22
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: website/package-lock.json
    - name: Install FFmpeg test prerequisites
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
    - name: Restore and test .NET solution
      run: |
        dotnet restore ScreenRecorder.sln
        dotnet test ScreenRecorder.sln -c Release --no-restore -m:1 /nodeReuse:false
    - name: Block High and Critical NuGet vulnerabilities
      run: node scripts/check-nuget-vulnerabilities.mjs ScreenRecorder.sln
    - name: Test website
      run: |
        npm ci --prefix website
        npm test --prefix website

  verify-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Install pinned FFmpeg test prerequisites
      shell: powershell
      run: |
        $ffmpegBin = & .\scripts\install-windows-ffmpeg.ps1 -Destination "$env:RUNNER_TEMP\opencam-ffmpeg"
        $ffmpegBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Test Windows-compatible solution
      run: |
        dotnet restore ScreenRecorder.sln
        dotnet test ScreenRecorder.sln -c Release --no-restore -m:1 /nodeReuse:false

  verify-macos:
    runs-on: macos-15
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Setup Node.js 22
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: website/package-lock.json
    - name: Install FFmpeg test prerequisites
      run: brew install ffmpeg
    - name: Test macOS-compatible solution
      run: |
        dotnet restore ScreenRecorder.sln
        dotnet test ScreenRecorder.sln -c Release --no-restore -m:1 /nodeReuse:false
    - name: Test website and macOS icon packaging
      run: |
        npm ci --prefix website
        npm test --prefix website
    - name: Test native system-audio helper
      run: bash tests/native/OpenCamSystemAudioTests.sh

  build-windows:
    needs: [verify-portable, verify-windows]
    runs-on: windows-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup Node.js for release notice verification
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Load canonical product version
      run: |
        node scripts/check-version-consistency.mjs
        $version = (Get-Content VERSION -Raw).Trim()
        "OPENCAM_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Restore Dependencies
      run: dotnet restore src/ScreenRecorder.UI/ScreenRecorder.UI.csproj

    - name: Build and Publish Windows
      run: |
        dotnet publish src/ScreenRecorder.UI/ScreenRecorder.UI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o installer/publish

    - name: Install pinned FFmpeg for Windows package
      shell: powershell
      run: |
        .\scripts\install-windows-ffmpeg.ps1 -Destination "installer\publish" | Out-Null

    - name: Add project license and corresponding source notice
      run: |
        Copy-Item LICENSE installer/publish/LICENSE
        Copy-Item LICENSE installer/publish/LICENSE.txt
        Copy-Item NOTICE.md installer/publish/NOTICE.md
        node scripts/assemble-third-party-notices.mjs installer/publish win-x64 installer/publish/ffmpeg-notices
        if ($LASTEXITCODE -ne 0) { throw "Third-party notice assembly failed" }
        @"
        OpenCam $env:OPENCAM_VERSION
        SPDX-License-Identifier: AGPL-3.0-or-later
        Corresponding source: https://github.com/kaoshou/OpenCam/tree/$env:GITHUB_SHA
        "@ | Set-Content installer/publish/SOURCE.txt -Encoding utf8
        node scripts/check-release-notices.mjs installer/publish $env:GITHUB_SHA $env:OPENCAM_VERSION --installer
        
    - name: Create Windows Portable ZIP
      run: |
        Compress-Archive -Path "installer/publish/*" -DestinationPath "OpenCam_Windows_Portable.zip" -Force

    - name: Compile Inno Setup Installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" "/DMyAppVersion=$env:OPENCAM_VERSION" installer\OpenCam.iss

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OpenCam-Windows-Builds
        path: |
          installer/Output/OpenCam_*_Setup.exe
          OpenCam_Windows_Portable.zip
        
  build-macos:
    needs: [verify-portable, verify-macos]
    runs-on: macos-15
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup Node.js for release notice verification
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Load canonical product version
      run: |
        node scripts/check-version-consistency.mjs
        printf 'OPENCAM_VERSION=%s\n' "$(tr -d '\n' < VERSION)" >> "$GITHUB_ENV"

    - name: Build and Publish macOS
      run: |
        dotnet publish src/ScreenRecorder.UI/ScreenRecorder.UI.csproj -c Release -r osx-arm64 --self-contained true -p:PublishSingleFile=false -o publish/osx-arm64

    - name: Build self-contained FFmpeg for Apple Silicon
      run: |
        chmod +x scripts/build-ffmpeg-macos-arm64.sh
        scripts/build-ffmpeg-macos-arm64.sh publish/osx-arm64
        
    - name: Create macOS App Bundle
      run: |
        chmod +x scripts/package-macos.sh scripts/verify-macos-bundle.sh
        scripts/package-macos.sh publish/osx-arm64 OpenCam.app Release
        node scripts/check-release-notices.mjs OpenCam.app/Contents/Resources "$GITHUB_SHA" "$OPENCAM_VERSION"

    - name: Create DMG
      run: |
        # hdiutil can transiently report "Resource busy" on hosted runners
        # immediately after signing a large app bundle. Retry the clean
        # srcfolder build and verify the image before publishing it.
        mkdir -p dmg_staging
        cp -R OpenCam.app dmg_staging/
        ln -s /Applications dmg_staging/Applications
        for attempt in 1 2 3; do
          if hdiutil create -volname "OpenCam" -srcfolder "$PWD/dmg_staging" -ov -format UDZO OpenCam_macOS_AppleSilicon.dmg; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            exit 1
          fi
          sleep 5
        done
        hdiutil verify OpenCam_macOS_AppleSilicon.dmg
        rm -rf dmg_staging

    - name: Upload macOS DMG as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenCam-macOS-DMG
        path: OpenCam_macOS_AppleSilicon.dmg
        

  publish-release:
    needs:
      - build-windows
      - build-macos
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
    - name: Download Windows Builds
      uses: actions/download-artifact@v4
      with:
        name: OpenCam-Windows-Builds
        path: release-assets/windows

    - name: Download macOS DMG
      uses: actions/download-artifact@v4
      with:
        name: OpenCam-macOS-DMG
        path: release-assets/macos

    - name: Create or Update GitHub Release
      shell: bash
      run: |
        set -euo pipefail

        if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
        fi

        upload_asset() {
          local asset="$1"
          for attempt in 1 2 3; do
            if gh release upload "$RELEASE_TAG" "$asset" --clobber; then
              return 0
            fi
            if [ "$attempt" -eq 3 ]; then
              return 1
            fi
            sleep $((attempt * 10))
          done
        }

        upload_asset release-assets/windows/installer/Output/OpenCam_*_Setup.exe
        upload_asset release-assets/windows/OpenCam_Windows_Portable.zip
        upload_asset release-assets/macos/OpenCam_macOS_AppleSilicon.dmg
