# SPDX-License-Identifier: AGPL-3.0-or-later
name: Build and Release OpenCam

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish (leave blank for build only)
        required: false
        type: string
  push:
    branches:
      - 'master'
    tags:
      - 'v*'

permissions:
  contents: read

env:
  OPENCAM_TEST_UI_TRACE: ${{ github.workspace }}/test-results/headless-lifecycle.jsonl

jobs:
  verify-portable:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.404'
    - name: Setup Node.js 22
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: website/package-lock.json
    - name: Install FFmpeg test prerequisites
      run: |
        if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then exit 0; fi
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg
    - name: Record test environment
      run: node scripts/collect-test-environment.mjs
    - name: Restore and test .NET solution
      run: |
        dotnet restore ScreenRecorder.sln
        dotnet build ScreenRecorder.sln -c Release --no-restore -m:1 /nodeReuse:false
        cc -Wall -Wextra -Werror tests/native/linux-spawn-tests.c src/ScreenRecorder.Platform.Linux/Native/spawn.c -o "$RUNNER_TEMP/opencam-linux-spawn-tests"
        "$RUNNER_TEMP/opencam-linux-spawn-tests"
        test_output=tests/ScreenRecorder.Media.Tests/bin/Release/net10.0
        cc -shared -fPIC -O2 -Wall -Wextra -Werror src/ScreenRecorder.Platform.Linux/Native/spawn.c -o "$test_output/libOpenCamLinuxSpawn.so"
        cp "$test_output/libOpenCamLinuxSpawn.so" "$test_output/project-recording-probe/"
        dotnet test ScreenRecorder.sln -c Release --no-build --no-restore -m:1 /nodeReuse:false --logger trx --results-directory test-results
    - name: Preserve test evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-evidence-portable-${{ github.run_attempt }}
        path: test-results/
        retention-days: 7
        if-no-files-found: warn
    - name: Block High and Critical NuGet vulnerabilities
      run: node scripts/check-nuget-vulnerabilities.mjs ScreenRecorder.sln
    - name: Test website
      run: |
        npm ci --prefix website
        npm test --prefix website
        node --test tests/web-player/player.test.mjs
        node --test tests/ci/*.test.mjs
        node --test tests/scripts/release-delivery.test.mjs tests/scripts/test-instructions.test.mjs tests/scripts/release-source-assembly.test.mjs tests/scripts/release-source-provision.test.mjs
        node --test tests/scripts/third-party-notice-profile.test.mjs tests/scripts/linux-runtime-notices.test.mjs
        node --test tests/scripts/obs-source-delivery.test.mjs

  verify-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.404'
    - name: Setup Node.js 22
      uses: actions/setup-node@v7
      with:
        node-version: '22'
    - name: Verify annotation input on the Windows desktop
      timeout-minutes: 3
      run: dotnet run --project tests/ScreenRecorder.AnnotationDesktopProbe/ScreenRecorder.AnnotationDesktopProbe.csproj -c Release
    - name: Install pinned FFmpeg test prerequisites
      shell: powershell
      run: |
        $ffmpegBin = & .\scripts\install-windows-ffmpeg.ps1 -Destination "$env:RUNNER_TEMP\opencam-ffmpeg"
        $ffmpegBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Record test environment
      run: node scripts/collect-test-environment.mjs
    - name: Test Windows-compatible solution
      run: |
        dotnet tool install dotnet-stack --version 10.0.750501 --tool-path "$env:RUNNER_TEMP\opencam-diagnostics"
        if ($LASTEXITCODE -ne 0) { throw "Diagnostic tool installation failed" }
        $env:OPENCAM_TEST_STACK_TOOL = "$env:RUNNER_TEMP\opencam-diagnostics\dotnet-stack.exe"
        dotnet restore ScreenRecorder.sln
        if ($LASTEXITCODE -ne 0) { throw "Solution restore failed" }
        dotnet test ScreenRecorder.sln -c Release --no-restore -m:1 /nodeReuse:false --logger trx --results-directory test-results
    - name: Preserve test evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-evidence-windows-${{ github.run_attempt }}
        path: test-results/
        retention-days: 7
        if-no-files-found: warn

  verify-macos:
    runs-on: macos-15
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.404'
    - name: Setup Node.js 22
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: website/package-lock.json
    - name: Install FFmpeg test prerequisites
      run: brew install ffmpeg
    - name: Record test environment
      run: node scripts/collect-test-environment.mjs
    - name: Test macOS-compatible solution
      run: |
        dotnet restore ScreenRecorder.sln
        dotnet test ScreenRecorder.sln -c Release --no-restore -m:1 /nodeReuse:false --logger trx --results-directory test-results
    - name: Preserve test evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-evidence-macos-${{ github.run_attempt }}
        path: test-results/
        retention-days: 7
        if-no-files-found: warn
    - name: Test website and macOS icon packaging
      run: |
        npm ci --prefix website
        npm test --prefix website
        node --test tests/web-player/player.test.mjs
    - name: Test native system-audio helper
      run: bash tests/native/OpenCamSystemAudioTests.sh
    - name: Compile and validate ScreenCaptureKit helper arguments
      run: bash tests/native/OpenCamScreenCaptureTests.sh

  build-obs:
    needs: [verify-portable, verify-windows, verify-macos]
    uses: ./.github/workflows/verify-obs-core.yml
    with:
      release_package: true

  build-linux:
    needs: [verify-portable, verify-windows, verify-macos]
    uses: ./.github/workflows/linux-app-test.yml

  publish-release:
    needs:
      - build-obs
      - build-linux
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js for artifact names
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Load canonical artifact names
      run: |
        node scripts/check-version-consistency.mjs
        node scripts/release-artifact-names.mjs >> "$GITHUB_ENV"

    - name: Verify release tag matches this build
      run: |
        test "$RELEASE_TAG" = "v$OPENCAM_VERSION"
        git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/opencam-release-verification/$RELEASE_TAG"
        test "$(git rev-parse "refs/opencam-release-verification/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"

    - name: Download Windows Builds
      uses: actions/download-artifact@v4
      with:
        name: OpenCam-v${{ env.OPENCAM_VERSION }}-Windows-x64
        path: release-assets/windows

    - name: Download macOS DMG
      uses: actions/download-artifact@v4
      with:
        name: OpenCam-v${{ env.OPENCAM_VERSION }}-macOS-arm64
        path: release-assets/macos

    - name: Download verified Linux Beta and corresponding sources
      uses: actions/download-artifact@v4
      with:
        name: OpenCam-Linux-Beta-${{ github.sha }}
        path: release-assets/linux

    - name: Verify all Linux Beta assets
      run: |
        cd release-assets/linux
        test -s "$LINUX_DEB"
        test -s "$LINUX_ARCHIVE"
        test -s "$LINUX_SOURCES"
        test -s "$LINUX_CHECKSUMS"
        sha256sum --check "$LINUX_CHECKSUMS"

    - uses: actions/download-artifact@v4
      with:
        name: obs-corresponding-sources-${{ github.sha }}
        path: source-inputs/obs
    - uses: actions/download-artifact@v4
      with:
        name: owned-windows-media-${{ github.sha }}
        path: source-inputs/windows
    - uses: actions/download-artifact@v4
      with:
        name: macos-media-sources-${{ github.sha }}
        path: source-inputs/macos
    - name: Require reviewed corresponding-source delivery before publication
      run: |
        node scripts/assemble-release-sources.mjs release-assets/sources source-inputs/obs source-inputs/windows source-inputs/macos
        node scripts/check-release-source-provision.mjs release-assets/sources

    - name: Assemble compact verified release delivery
      run: |
        node scripts/assemble-release-delivery.mjs release-assets/delivery release-assets/sources release-assets/linux release-assets/windows release-assets/macos
        cd release-assets/delivery
        sha256sum --check "$RELEASE_CHECKSUMS"

    - name: Create or Update GitHub Release
      shell: bash
      run: |
        set -euo pipefail

        test -s "release-assets/windows/installer/Output/$WINDOWS_SETUP"
        test -s "release-assets/windows/$WINDOWS_PORTABLE"
        test -s "release-assets/macos/$MACOS_DMG"

        if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
          gh release create "$RELEASE_TAG" --verify-tag --draft --notes-file "docs/releases/$RELEASE_TAG.md" --title "OpenCam $RELEASE_TAG"
        fi

        upload_asset() {
          local asset="$1"
          for attempt in 1 2 3; do
            if node scripts/upload-release-asset.mjs "$RELEASE_TAG" "$asset"; then
              return 0
            fi
            if [ "$attempt" -eq 3 ]; then
              return 1
            fi
            sleep $((attempt * 10))
          done
        }

        for release_asset in "$WINDOWS_SETUP" "$WINDOWS_PORTABLE" "$MACOS_DMG" "$LINUX_DEB" "$LINUX_ARCHIVE" "$RELEASE_SOURCES" "$RELEASE_CHECKSUMS"; do
          upload_asset "release-assets/delivery/$release_asset"
        done
        gh release edit "$RELEASE_TAG" --draft=false --latest
