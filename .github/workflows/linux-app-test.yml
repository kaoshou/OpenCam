# SPDX-License-Identifier: AGPL-3.0-or-later
name: Linux application development test package

on:
  push:
    branches: ['codex/linux-app-test-20261030']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/checkout@v4
        with:
          repository: obsproject/obs-studio
          ref: 72e86655715d9a25d69ce446aa4dd44ba58e10d2
          path: .linux-inputs/obs
      - uses: actions/checkout@v4
        with:
          repository: FFmpeg/FFmpeg
          ref: 1041abdc962f4cc4f394aa8de9dc5236c0c3b9e7
          path: .linux-inputs/ffmpeg
      - name: Install build-only Ubuntu prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends build-essential cmake extra-cmake-modules ninja-build nasm pkg-config zlib1g-dev libsimde-dev uthash-dev libjansson-dev uuid-dev libx11-xcb-dev libxcb-xinput-dev libxkbcommon-dev libwayland-dev libdrm-dev libegl1-mesa-dev libpulse-dev libx264-dev libpipewire-0.3-dev libglib2.0-dev libxcb-composite0-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev libxcb-xinerama0-dev xvfb xauth dbus-x11 pulseaudio pulseaudio-utils ffmpeg gdb
      - name: Restore verified FFmpeg version metadata for upstream CMake
        run: |
          git -C .linux-inputs/ffmpeg fetch --depth 1 origin tag n8.1.3
          test "$(git -C .linux-inputs/ffmpeg rev-parse 'n8.1.3^{commit}')" = 1041abdc962f4cc4f394aa8de9dc5236c0c3b9e7
      - name: Check production source isolation and input tests
        env:
          OPENCAM_LINUX_OBS_SOURCE: ${{ github.workspace }}/.linux-inputs/obs
        run: |
          mkdir -p "$RUNNER_TEMP/opencam-linux/evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/opencam-linux/evidence/revision.txt"
          git diff e0c369e6495532cc0393c349dc428ffb8a00327e -- src native/obs-capture scripts/build-obs-capture.sh scripts/build-obs-capture.ps1 scripts/assemble-obs-runtime.mjs .github/workflows/build-and-release.yml .github/workflows/package-release.yml VERSION > "$RUNNER_TEMP/opencam-linux/evidence/production-diff.txt"
          test ! -s "$RUNNER_TEMP/opencam-linux/evidence/production-diff.txt"
          node --test tests/scripts/linux-obs-inputs.test.mjs > "$RUNNER_TEMP/opencam-linux/evidence/input-tests.log" 2>&1
          node --test tests/scripts/linux-probe-protocol.test.mjs > "$RUNNER_TEMP/opencam-linux/evidence/protocol-tests.log" 2>&1
          node --test tests/scripts/linux-probe-runner.test.mjs > "$RUNNER_TEMP/opencam-linux/evidence/runner-tests.log" 2>&1
          node --test tests/scripts/linux-isolation.test.mjs > "$RUNNER_TEMP/opencam-linux/evidence/isolation-tests.log" 2>&1
          git diff 7bc17eb -- native/obs-capture scripts/build-obs-capture.sh scripts/build-obs-capture.ps1 scripts/assemble-obs-runtime.mjs .github/workflows/build-and-release.yml .github/workflows/package-release.yml VERSION > "$RUNNER_TEMP/opencam-linux/evidence/production-audit.diff"
          test ! -s "$RUNNER_TEMP/opencam-linux/evidence/production-audit.diff"
          c++ -std=c++17 tests/native/linux-source-health-tests.cpp -o "$RUNNER_TEMP/opencam-linux/health-tests"
          "$RUNNER_TEMP/opencam-linux/health-tests"
          bash -n scripts/linux/build-obs-probe.sh
          bash -n scripts/linux/build-ffmpeg-dependency.sh
      - name: Build pinned FFmpeg libraries into private Linux prefix
        run: |
          bash scripts/linux/build-app-media.sh "$GITHUB_WORKSPACE/.linux-inputs/ffmpeg" "$RUNNER_TEMP/opencam-linux/ffmpeg-build" "$RUNNER_TEMP/opencam-linux/ffmpeg-prefix" "$RUNNER_TEMP/opencam-linux/evidence/ffmpeg" > "$RUNNER_TEMP/opencam-linux/evidence/ffmpeg-driver.log" 2>&1
      - name: Build pinned OBS core without changing other platform builders
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/opencam-linux/ffmpeg-prefix/lib/pkgconfig
          LD_LIBRARY_PATH: ${{ runner.temp }}/opencam-linux/ffmpeg-prefix/lib
        run: |
          bash scripts/linux/build-obs-probe.sh "$GITHUB_WORKSPACE/.linux-inputs/obs" "$RUNNER_TEMP/opencam-linux/obs-build" "$RUNNER_TEMP/opencam-linux/obs-stage" "$RUNNER_TEMP/opencam-linux/evidence/obs" > "$RUNNER_TEMP/opencam-linux/evidence/obs-driver.log" 2>&1
      - name: Build Linux-only native source probe from unchanged pinned sources
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/opencam-linux/obs-stage/lib/pkgconfig:${{ runner.temp }}/opencam-linux/ffmpeg-prefix/lib/pkgconfig
          LD_LIBRARY_PATH: ${{ runner.temp }}/opencam-linux/obs-stage/lib:${{ runner.temp }}/opencam-linux/ffmpeg-prefix/lib
        run: |
          cmake -S native/obs-linux-probe -B "$RUNNER_TEMP/opencam-linux/probe-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/opencam-linux/obs-stage" -DOBS_SOURCE="$GITHUB_WORKSPACE/.linux-inputs/obs" -DOBS_RUNTIME="$RUNNER_TEMP/opencam-linux/obs-stage" > "$RUNNER_TEMP/opencam-linux/evidence/probe-configure.log" 2>&1
          cmake --build "$RUNNER_TEMP/opencam-linux/probe-build" --parallel 2 > "$RUNNER_TEMP/opencam-linux/evidence/probe-build.log" 2>&1
          cmake --install "$RUNNER_TEMP/opencam-linux/probe-build" > "$RUNNER_TEMP/opencam-linux/evidence/probe-install.log" 2>&1
          OPENCAM_LINUX_HELPER="$RUNNER_TEMP/opencam-linux/obs-stage/bin/OpenCam.ObsLinuxProbe" OPENCAM_LINUX_RUNTIME="$RUNNER_TEMP/opencam-linux/obs-stage" node --test tests/native/linux-obs-probe.test.mjs > "$RUNNER_TEMP/opencam-linux/evidence/probe-input-tests.log" 2>&1
      - name: Test product helper protocol
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/opencam-linux/obs-stage/lib:${{ runner.temp }}/opencam-linux/ffmpeg-prefix/lib
          OPENCAM_LINUX_HELPER: ${{ runner.temp }}/opencam-linux/obs-stage/bin/OpenCam.ObsLinuxProbe
          OPENCAM_LINUX_RUNTIME: ${{ runner.temp }}/opencam-linux/obs-stage
        run: node --test tests/native/linux-product-protocol.test.mjs > "$RUNNER_TEMP/opencam-linux/evidence/product-protocol.log" 2>&1
      - name: Validate Linux glibc FD mapping and inherited descriptor closure
        run: |
          cc -Wall -Wextra -Werror tests/native/linux-spawn-tests.c src/ScreenRecorder.Platform.Linux/Native/spawn.c -o "$RUNNER_TEMP/opencam-linux/spawn-tests"
          "$RUNNER_TEMP/opencam-linux/spawn-tests" > "$RUNNER_TEMP/opencam-linux/evidence/spawn-tests.log" 2>&1
      - name: Real X11 source in isolated virtual desktop (not physical acceptance)
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/opencam-linux/obs-stage/lib:${{ runner.temp }}/opencam-linux/ffmpeg-prefix/lib
          OPENCAM_LINUX_HELPER: ${{ runner.temp }}/opencam-linux/obs-stage/bin/OpenCam.ObsLinuxProbe
          OPENCAM_LINUX_RUNTIME: ${{ runner.temp }}/opencam-linux/obs-stage
          LIBGL_ALWAYS_SOFTWARE: '1'
          XDG_SESSION_TYPE: x11
          OPENCAM_LINUX_PROBE_DIAGNOSTICS: '1'
          OPENCAM_LINUX_FIXTURE_AUDIO: '1'
        run: |
          dbus-run-session -- xvfb-run -a -s '-screen 0 640x360x24' bash -c '
            set -euo pipefail
            export PULSE_RUNTIME_PATH="$RUNNER_TEMP/opencam-linux/pulse"
            mkdir -m 700 "$PULSE_RUNTIME_PATH"
            pulseaudio -n --daemonize=yes --exit-idle-time=-1 --load=module-native-protocol-unix --load="module-null-sink sink_name=opencam_test"
            trap "pulseaudio --kill 2>/dev/null || true" EXIT
            pactl load-module module-remap-source master=opencam_test.monitor source_name=opencam_mic > "$RUNNER_TEMP/opencam-linux/evidence/virtual-mic-module.txt"
            if ! OPENCAM_LINUX_REAL_CAPTURE=1 node --test tests/native/linux-obs-probe.test.mjs > "$RUNNER_TEMP/opencam-linux/evidence/probe-x11-tests.log" 2>&1; then
              gdb -batch -ex run -ex "thread apply all bt" --args "$OPENCAM_LINUX_HELPER" --runtime "$OPENCAM_LINUX_RUNTIME" --mode enumerate --backend x11 > "$RUNNER_TEMP/opencam-linux/evidence/probe-x11-backtrace.log" 2>&1 || true
              exit 1
            fi
            (while true; do xsetroot -solid "#e04020"; sleep .2; xsetroot -solid "#2040e0"; sleep .2; done) &
            pattern_pid=$!
            trap "kill $pattern_pid 2>/dev/null || true; pulseaudio --kill 2>/dev/null || true" EXIT
            node scripts/linux/run-capture-probe.mjs "$OPENCAM_LINUX_HELPER" "$OPENCAM_LINUX_RUNTIME" "$RUNNER_TEMP/opencam-linux/evidence/x11-20fps" 3 "{\"protocol\":1,\"synthetic\":false,\"width\":640,\"height\":360,\"fps\":20,\"x\":0,\"y\":0,\"monitorWidth\":640,\"monitorHeight\":360,\"cropX\":0,\"cropY\":0,\"monitor\":\"xshm:0\",\"audio\":\"none\",\"systemDevice\":\"\",\"microphone\":\"\",\"cursor\":true,\"encoder\":\"cpu\",\"quality\":23}" > "$RUNNER_TEMP/opencam-linux/evidence/x11-driver.log" 2>&1
            for audio in system microphone both; do
              node scripts/linux/run-capture-probe.mjs "$OPENCAM_LINUX_HELPER" "$OPENCAM_LINUX_RUNTIME" "$RUNNER_TEMP/opencam-linux/evidence/x11-20fps-$audio-silent" 3 "{\"protocol\":1,\"synthetic\":false,\"width\":640,\"height\":360,\"fps\":20,\"x\":0,\"y\":0,\"monitorWidth\":640,\"monitorHeight\":360,\"cropX\":0,\"cropY\":0,\"monitor\":\"xshm:0\",\"audio\":\"$audio\",\"systemDevice\":\"opencam_test.monitor\",\"microphone\":\"opencam_mic\",\"cursor\":true,\"encoder\":\"cpu\",\"quality\":23}" > "$RUNNER_TEMP/opencam-linux/evidence/x11-$audio-driver.log" 2>&1
            done
          '
      - name: Preserve logs only; this is not a working OpenCam recorder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenCam-v1.2.0-Linux-App-Test-Logs-${{ github.sha }}
          path: ${{ runner.temp }}/opencam-linux/evidence/
          if-no-files-found: error
          retention-days: 14
