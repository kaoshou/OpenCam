# SPDX-License-Identifier: AGPL-3.0-or-later
name: Linux application development test package

on:
  push:
    branches: ['codex/linux-app-test-20261030']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/checkout@v4
        with:
          repository: obsproject/obs-studio
          ref: 72e86655715d9a25d69ce446aa4dd44ba58e10d2
          path: .linux-inputs/obs
      - uses: actions/checkout@v4
        with:
          repository: FFmpeg/FFmpeg
          ref: 1041abdc962f4cc4f394aa8de9dc5236c0c3b9e7
          path: .linux-inputs/ffmpeg
      - name: Install build-only Ubuntu prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends build-essential cmake extra-cmake-modules ninja-build nasm pkg-config zlib1g-dev libsimde-dev uthash-dev libjansson-dev uuid-dev libx11-xcb-dev libxcb-xinput-dev libxkbcommon-dev libwayland-dev libdrm-dev libegl1-mesa-dev libpulse-dev libx264-dev libpipewire-0.3-dev libglib2.0-dev libxcb-composite0-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev libxcb-xinerama0-dev xvfb xauth dbus-x11 pulseaudio pulseaudio-utils ffmpeg gdb patchelf scrot x11-utils x11-xserver-utils fonts-noto-cjk sway pipewire wireplumber xdg-desktop-portal xdg-desktop-portal-wlr
          command -v xsetroot
      - name: Restore verified FFmpeg version metadata for upstream CMake
        run: |
          git -C .linux-inputs/ffmpeg fetch --depth 1 origin tag n8.1.3
          test "$(git -C .linux-inputs/ffmpeg rev-parse 'n8.1.3^{commit}')" = 1041abdc962f4cc4f394aa8de9dc5236c0c3b9e7
      - name: Check production source isolation and input tests
        env:
          OPENCAM_LINUX_OBS_SOURCE: ${{ github.workspace }}/.linux-inputs/obs
        run: |
          mkdir -p "$RUNNER_TEMP/opencam-linux/evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/opencam-linux/evidence/revision.txt"
          git diff e0c369e6495532cc0393c349dc428ffb8a00327e -- src/ScreenRecorder.Platform.Windows src/ScreenRecorder.Platform.macOS native/obs-capture scripts/build-obs-capture.sh scripts/build-obs-capture.ps1 scripts/assemble-obs-runtime.mjs .github/workflows/build-and-release.yml .github/workflows/package-release.yml VERSION > "$RUNNER_TEMP/opencam-linux/evidence/production-diff.txt"
          test ! -s "$RUNNER_TEMP/opencam-linux/evidence/production-diff.txt"
          node --test tests/scripts/linux-obs-inputs.test.mjs > "$RUNNER_TEMP/opencam-linux/evidence/input-tests.log" 2>&1
          node --test tests/scripts/linux-probe-protocol.test.mjs > "$RUNNER_TEMP/opencam-linux/evidence/protocol-tests.log" 2>&1
          node --test tests/scripts/linux-probe-runner.test.mjs > "$RUNNER_TEMP/opencam-linux/evidence/runner-tests.log" 2>&1
          node --test tests/scripts/linux-isolation.test.mjs > "$RUNNER_TEMP/opencam-linux/evidence/isolation-tests.log" 2>&1
          node --test tests/scripts/linux-app-assembly.test.mjs tests/scripts/linux-app-media-validation.test.mjs > "$RUNNER_TEMP/opencam-linux/evidence/package-unit-tests.log" 2>&1
          git diff 7bc17eb -- native/obs-capture scripts/build-obs-capture.sh scripts/build-obs-capture.ps1 scripts/assemble-obs-runtime.mjs .github/workflows/build-and-release.yml .github/workflows/package-release.yml VERSION > "$RUNNER_TEMP/opencam-linux/evidence/production-audit.diff"
          test ! -s "$RUNNER_TEMP/opencam-linux/evidence/production-audit.diff"
          c++ -std=c++17 tests/native/linux-source-health-tests.cpp -o "$RUNNER_TEMP/opencam-linux/health-tests"
          "$RUNNER_TEMP/opencam-linux/health-tests"
          c++ -std=c++17 tests/native/linux-audio-meter-tests.cpp -o "$RUNNER_TEMP/opencam-linux/meter-tests"
          "$RUNNER_TEMP/opencam-linux/meter-tests"
          bash -n scripts/linux/build-obs-probe.sh
          bash -n scripts/linux/build-ffmpeg-dependency.sh
      - name: Restore exact private FFmpeg build profile
        id: media-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/opencam-linux/ffmpeg-prefix
            ${{ runner.temp }}/opencam-linux/evidence/ffmpeg
          key: opencam-ubuntu24-x64-media-v1-${{ hashFiles('scripts/linux/build-app-media.sh') }}
      - name: Build pinned FFmpeg libraries into private Linux prefix
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/linux/build-app-media.sh "$GITHUB_WORKSPACE/.linux-inputs/ffmpeg" "$RUNNER_TEMP/opencam-linux/ffmpeg-build" "$RUNNER_TEMP/opencam-linux/ffmpeg-prefix" "$RUNNER_TEMP/opencam-linux/evidence/ffmpeg" > "$RUNNER_TEMP/opencam-linux/evidence/ffmpeg-driver.log" 2>&1
      - name: Cache successfully compiled private media tools
        if: steps.media-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/opencam-linux/ffmpeg-prefix
            ${{ runner.temp }}/opencam-linux/evidence/ffmpeg
          key: ${{ steps.media-cache.outputs.cache-primary-key }}
      - name: Exercise required media formats before long recording
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/opencam-linux/ffmpeg-prefix/lib
        run: |
          tool="$RUNNER_TEMP/opencam-linux/ffmpeg-prefix/bin/ffmpeg"
          "$tool" -v error -f lavfi -i 'anullsrc=r=48000:cl=stereo,aformat=sample_fmts=flt' -t 0.1 -c:a pcm_f32le -f f32le "$RUNNER_TEMP/opencam-linux/evidence/format-check.f32le"
          "$tool" -v error -f f32le -ar 48000 -ac 2 -i "$RUNNER_TEMP/opencam-linux/evidence/format-check.f32le" -c:a pcm_s16le -f s16le "$RUNNER_TEMP/opencam-linux/evidence/format-check.s16le"
          "$tool" -v error -f lavfi -i color=c=red:s=64x36:r=20 -t 0.1 -c:v libx264 -pix_fmt yuv420p -f mp4 "$RUNNER_TEMP/opencam-linux/evidence/format-check.mp4"
          test -s "$RUNNER_TEMP/opencam-linux/evidence/format-check.f32le"
          test -s "$RUNNER_TEMP/opencam-linux/evidence/format-check.s16le"
          test -s "$RUNNER_TEMP/opencam-linux/evidence/format-check.mp4"
      - name: Build pinned OBS core without changing other platform builders
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/opencam-linux/ffmpeg-prefix/lib/pkgconfig
          LD_LIBRARY_PATH: ${{ runner.temp }}/opencam-linux/ffmpeg-prefix/lib
        run: |
          bash scripts/linux/build-obs-probe.sh "$GITHUB_WORKSPACE/.linux-inputs/obs" "$RUNNER_TEMP/opencam-linux/obs-build" "$RUNNER_TEMP/opencam-linux/obs-stage" "$RUNNER_TEMP/opencam-linux/evidence/obs" > "$RUNNER_TEMP/opencam-linux/evidence/obs-driver.log" 2>&1
      - name: Build Linux-only native source probe from unchanged pinned sources
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/opencam-linux/obs-stage/lib/pkgconfig:${{ runner.temp }}/opencam-linux/ffmpeg-prefix/lib/pkgconfig
          LD_LIBRARY_PATH: ${{ runner.temp }}/opencam-linux/obs-stage/lib:${{ runner.temp }}/opencam-linux/ffmpeg-prefix/lib
        run: |
          cmake -S native/obs-linux-probe -B "$RUNNER_TEMP/opencam-linux/probe-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/opencam-linux/obs-stage" -DOBS_SOURCE="$GITHUB_WORKSPACE/.linux-inputs/obs" -DOBS_RUNTIME="$RUNNER_TEMP/opencam-linux/obs-stage" > "$RUNNER_TEMP/opencam-linux/evidence/probe-configure.log" 2>&1
          cmake --build "$RUNNER_TEMP/opencam-linux/probe-build" --parallel 2 > "$RUNNER_TEMP/opencam-linux/evidence/probe-build.log" 2>&1
          cmake --install "$RUNNER_TEMP/opencam-linux/probe-build" > "$RUNNER_TEMP/opencam-linux/evidence/probe-install.log" 2>&1
          OPENCAM_LINUX_HELPER="$RUNNER_TEMP/opencam-linux/obs-stage/bin/OpenCam.ObsLinuxProbe" OPENCAM_LINUX_RUNTIME="$RUNNER_TEMP/opencam-linux/obs-stage" node --test tests/native/linux-obs-probe.test.mjs > "$RUNNER_TEMP/opencam-linux/evidence/probe-input-tests.log" 2>&1
      - name: Test product helper protocol
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/opencam-linux/obs-stage/lib:${{ runner.temp }}/opencam-linux/ffmpeg-prefix/lib
          OPENCAM_LINUX_HELPER: ${{ runner.temp }}/opencam-linux/obs-stage/bin/OpenCam.ObsLinuxProbe
          OPENCAM_LINUX_RUNTIME: ${{ runner.temp }}/opencam-linux/obs-stage
        run: node --test tests/native/linux-product-protocol.test.mjs > "$RUNNER_TEMP/opencam-linux/evidence/product-protocol.log" 2>&1
      - name: Validate Linux glibc FD mapping and inherited descriptor closure
        run: |
          cc -Wall -Wextra -Werror tests/native/linux-spawn-tests.c src/ScreenRecorder.Platform.Linux/Native/spawn.c -o "$RUNNER_TEMP/opencam-linux/spawn-tests"
          "$RUNNER_TEMP/opencam-linux/spawn-tests" > "$RUNNER_TEMP/opencam-linux/evidence/spawn-tests.log" 2>&1
      - name: Real X11 source in isolated virtual desktop (not physical acceptance)
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/opencam-linux/obs-stage/lib:${{ runner.temp }}/opencam-linux/ffmpeg-prefix/lib
          OPENCAM_LINUX_HELPER: ${{ runner.temp }}/opencam-linux/obs-stage/bin/OpenCam.ObsLinuxProbe
          OPENCAM_LINUX_RUNTIME: ${{ runner.temp }}/opencam-linux/obs-stage
          LIBGL_ALWAYS_SOFTWARE: '1'
          XDG_SESSION_TYPE: x11
          OPENCAM_LINUX_PROBE_DIAGNOSTICS: '1'
          OPENCAM_LINUX_FIXTURE_AUDIO: '1'
        run: |
          dbus-run-session -- xvfb-run -a -s '-screen 0 640x360x24' bash -c '
            set -euo pipefail
            export PULSE_RUNTIME_PATH="$RUNNER_TEMP/opencam-linux/pulse"
            mkdir -m 700 "$PULSE_RUNTIME_PATH"
            pulseaudio -n --daemonize=yes --exit-idle-time=-1 --load=module-native-protocol-unix --load="module-null-sink sink_name=opencam_test"
            trap "pulseaudio --kill 2>/dev/null || true" EXIT
            pactl load-module module-remap-source master=opencam_test.monitor source_name=opencam_mic > "$RUNNER_TEMP/opencam-linux/evidence/virtual-mic-module.txt"
            if ! OPENCAM_LINUX_REAL_CAPTURE=1 node --test tests/native/linux-obs-probe.test.mjs > "$RUNNER_TEMP/opencam-linux/evidence/probe-x11-tests.log" 2>&1; then
              gdb -batch -ex run -ex "thread apply all bt" --args "$OPENCAM_LINUX_HELPER" --runtime "$OPENCAM_LINUX_RUNTIME" --mode enumerate --backend x11 > "$RUNNER_TEMP/opencam-linux/evidence/probe-x11-backtrace.log" 2>&1 || true
              exit 1
            fi
            (while true; do xsetroot -solid "#e04020"; sleep .2; xsetroot -solid "#2040e0"; sleep .2; done) &
            pattern_pid=$!
            trap "kill $pattern_pid 2>/dev/null || true; pulseaudio --kill 2>/dev/null || true" EXIT
            node scripts/linux/run-capture-probe.mjs "$OPENCAM_LINUX_HELPER" "$OPENCAM_LINUX_RUNTIME" "$RUNNER_TEMP/opencam-linux/evidence/x11-20fps" 3 "{\"protocol\":1,\"synthetic\":false,\"width\":640,\"height\":360,\"fps\":20,\"x\":0,\"y\":0,\"monitorWidth\":640,\"monitorHeight\":360,\"cropX\":0,\"cropY\":0,\"monitor\":\"xshm:0\",\"audio\":\"none\",\"systemDevice\":\"\",\"microphone\":\"\",\"cursor\":true,\"encoder\":\"cpu\",\"quality\":23}" > "$RUNNER_TEMP/opencam-linux/evidence/x11-driver.log" 2>&1
            for audio in system microphone both; do
              node scripts/linux/run-capture-probe.mjs "$OPENCAM_LINUX_HELPER" "$OPENCAM_LINUX_RUNTIME" "$RUNNER_TEMP/opencam-linux/evidence/x11-20fps-$audio-silent" 3 "{\"protocol\":1,\"synthetic\":false,\"width\":640,\"height\":360,\"fps\":20,\"x\":0,\"y\":0,\"monitorWidth\":640,\"monitorHeight\":360,\"cropX\":0,\"cropY\":0,\"monitor\":\"xshm:0\",\"audio\":\"$audio\",\"systemDevice\":\"opencam_test.monitor\",\"microphone\":\"opencam_mic\",\"cursor\":true,\"encoder\":\"cpu\",\"quality\":23}" > "$RUNNER_TEMP/opencam-linux/evidence/x11-$audio-driver.log" 2>&1
            done
          '
      - name: Build self-contained Linux application and native media helpers
        run: |
          dotnet publish src/ScreenRecorder.UI/ScreenRecorder.UI.csproj -c Release -r linux-x64 --self-contained true -p:OpenCamNativeOnlyTest=true -p:PublishSingleFile=false -m:1 -o "$RUNNER_TEMP/opencam-linux/publish" > "$RUNNER_TEMP/opencam-linux/evidence/app-publish.log" 2>&1
          cc -shared -fPIC -O2 -Wall -Wextra -Werror src/ScreenRecorder.Platform.Linux/Native/spawn.c -o "$RUNNER_TEMP/opencam-linux/publish/libOpenCamLinuxSpawn.so"
          cc -O2 -Wall -Wextra -Werror src/ScreenRecorder.Platform.Linux/Native/playback.c -o "$RUNNER_TEMP/opencam-linux/publish/OpenCam.PulsePlayback" $(pkg-config --cflags --libs libpulse-simple)
          dotnet publish tests/ScreenRecorder.LinuxAppProbe/ScreenRecorder.LinuxAppProbe.csproj -c Release -r linux-x64 --self-contained false -p:OpenCamNativeOnlyTest=true -m:1 -o "$RUNNER_TEMP/opencam-linux/acceptance" > "$RUNNER_TEMP/opencam-linux/evidence/app-probe-build.log" 2>&1
          node scripts/linux/assemble-app.mjs "$RUNNER_TEMP/opencam-linux/publish" "$RUNNER_TEMP/opencam-linux/obs-stage" "$RUNNER_TEMP/opencam-linux/ffmpeg-prefix" "$RUNNER_TEMP/opencam-linux/OpenCam Linux Test" "$GITHUB_SHA" "$(cat VERSION)" > "$RUNNER_TEMP/opencam-linux/evidence/assembly.log" 2>&1
          cp scripts/linux/Start-OpenCam.sh scripts/linux/Collect-Diagnostics.sh scripts/linux/README-LINUX-TEST.txt "$RUNNER_TEMP/opencam-linux/OpenCam Linux Test/"
          chmod +x "$RUNNER_TEMP/opencam-linux/OpenCam Linux Test/Start-OpenCam.sh" "$RUNNER_TEMP/opencam-linux/OpenCam Linux Test/Collect-Diagnostics.sh"
          mv "$RUNNER_TEMP/opencam-linux/acceptance" "$RUNNER_TEMP/opencam-linux/Relocated Service Test"
          cp -a "$RUNNER_TEMP/opencam-linux/OpenCam Linux Test/." "$RUNNER_TEMP/opencam-linux/Relocated Service Test/"
          dotnet build tests/ScreenRecorder.Media.Tests/ScreenRecorder.Media.Tests.csproj -c Release -m:1 > "$RUNNER_TEMP/opencam-linux/evidence/managed-tests-build.log" 2>&1
          cp "$RUNNER_TEMP/opencam-linux/publish/libOpenCamLinuxSpawn.so" tests/ScreenRecorder.Media.Tests/bin/Release/net8.0/
      - name: Actual Linux project recording editing export and relocated UI
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          XDG_SESSION_TYPE: x11
          OPENCAM_LINUX_PROBE_DIAGNOSTICS: '1'
        run: |
          export PATH="$RUNNER_TEMP/opencam-linux/ffmpeg-prefix/bin:$PATH"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/opencam-linux/ffmpeg-prefix/lib"
          dotnet test tests/ScreenRecorder.Media.Tests/ScreenRecorder.Media.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~Linux|FullyQualifiedName~ProjectMediaBackendTests' -m:1 > "$RUNNER_TEMP/opencam-linux/evidence/linux-managed-tests.log" 2>&1
          unset LD_LIBRARY_PATH LD_PRELOAD
          export PATH="$RUNNER_TEMP/opencam-linux/Relocated Service Test:$PATH"
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x1000x24' bash -c '
            set -euo pipefail
            export PULSE_RUNTIME_PATH="$RUNNER_TEMP/opencam-linux/app-pulse"
            export XDG_DATA_HOME="$RUNNER_TEMP/opencam-linux/app-user-data"
            mkdir -m 700 "$PULSE_RUNTIME_PATH"
            pulseaudio -n --daemonize=yes --exit-idle-time=-1 --load=module-native-protocol-unix --load="module-null-sink sink_name=opencam_test"
            trap "pulseaudio --kill 2>/dev/null || true" EXIT
            pactl load-module module-remap-source master=opencam_test.monitor source_name=opencam_mic > "$RUNNER_TEMP/opencam-linux/evidence/app-virtual-mic-module.txt"
            pactl -f json list sources > "$RUNNER_TEMP/opencam-linux/evidence/pulse-sources.json"
            pactl -f json list sinks > "$RUNNER_TEMP/opencam-linux/evidence/pulse-sinks.json"
            (while true; do xsetroot -solid "#e04020"; sleep .2; xsetroot -solid "#2040e0"; sleep .2; done) &
            pattern_pid=$!
            trap "kill $pattern_pid 2>/dev/null || true; pulseaudio --kill 2>/dev/null || true" EXIT
            (while true; do ffmpeg -v error -f lavfi -i "sine=frequency=440:duration=4:sample_rate=48000" -f pulse opencam_test; sleep 4; done) &
            tone_pid=$!
            trap "kill $pattern_pid $tone_pid 2>/dev/null || true; pulseaudio --kill 2>/dev/null || true" EXIT
            OPENCAM_LINUX_TEST_SECONDS=5 OPENCAM_LINUX_TEST_FPS=30 dotnet "$RUNNER_TEMP/opencam-linux/Relocated Service Test/ScreenRecorder.LinuxAppProbe.dll" "$RUNNER_TEMP/opencam-linux/evidence/app-project-smoke" > "$RUNNER_TEMP/opencam-linux/evidence/app-project-smoke.log" 2>&1
            node scripts/linux/verify-app-media.mjs "$RUNNER_TEMP/opencam-linux/evidence/app-project-smoke/result.json" > "$RUNNER_TEMP/opencam-linux/evidence/app-smoke-media-validation.log" 2>&1
            OPENCAM_LINUX_TEST_SECONDS=300 OPENCAM_LINUX_TEST_FPS=30 dotnet "$RUNNER_TEMP/opencam-linux/Relocated Service Test/ScreenRecorder.LinuxAppProbe.dll" "$RUNNER_TEMP/opencam-linux/evidence/app-project" > "$RUNNER_TEMP/opencam-linux/evidence/app-project.log" 2>&1
            OPENCAM_LINUX_TEST_SECONDS=10 OPENCAM_LINUX_TEST_FPS=20 dotnet "$RUNNER_TEMP/opencam-linux/Relocated Service Test/ScreenRecorder.LinuxAppProbe.dll" "$RUNNER_TEMP/opencam-linux/evidence/app-project-20fps" > "$RUNNER_TEMP/opencam-linux/evidence/app-project-20fps.log" 2>&1
            node scripts/linux/smoke-app.mjs "$RUNNER_TEMP/opencam-linux/OpenCam Linux Test" "$RUNNER_TEMP/opencam-linux/evidence/app-ui" > "$RUNNER_TEMP/opencam-linux/evidence/app-ui.log" 2>&1
          '
          node scripts/linux/verify-app-media.mjs "$RUNNER_TEMP/opencam-linux/evidence/app-project/result.json" > "$RUNNER_TEMP/opencam-linux/evidence/app-media-validation.log" 2>&1
          node scripts/linux/verify-app-media.mjs "$RUNNER_TEMP/opencam-linux/evidence/app-project-20fps/result.json" > "$RUNNER_TEMP/opencam-linux/evidence/app-media-validation-20fps.log" 2>&1
      - name: Attempt isolated Wayland portal capture (not GNOME physical acceptance)
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/opencam-linux/obs-stage/lib:${{ runner.temp }}/opencam-linux/ffmpeg-prefix/lib
          OPENCAM_DISPOSABLE_CI_DESKTOP: '1'
          OPENCAM_LINUX_PROBE_DIAGNOSTICS: '1'
        run: |
          set +e
          timeout 180 dbus-run-session -- bash scripts/linux/test-wayland.sh "$RUNNER_TEMP/opencam-linux/obs-stage/bin/OpenCam.ObsLinuxProbe" "$RUNNER_TEMP/opencam-linux/obs-stage" "$RUNNER_TEMP/opencam-linux/evidence/wayland" > "$RUNNER_TEMP/opencam-linux/evidence/wayland-driver.log" 2>&1
          status=$?
          printf 'Virtual Wayland fixture exit=%s; GNOME/physical portal acceptance remains MANUAL.\n' "$status" > "$RUNNER_TEMP/opencam-linux/evidence/wayland-status.txt"
          # This is an explicitly marked development package, not a Wayland support claim.
          # Preserve fixture failures rather than treating X11 as a portal substitute.
          exit 0
      - name: Audit ELF relocation and include source notices
        run: |
          package_directory="$RUNNER_TEMP/opencam-linux/OpenCam Linux Test"
          while IFS= read -r -d '' binary; do
            if file -b "$binary" | grep -q '^ELF'; then
              printf '\nFILE %s\n' "${binary#"$package_directory/"}" >> "$RUNNER_TEMP/opencam-linux/evidence/elf-dependencies.txt"
              dependencies=$(ldd "$binary")
              printf '%s\n' "$dependencies" >> "$RUNNER_TEMP/opencam-linux/evidence/elf-dependencies.txt"
              if [[ "$dependencies" == *'not found'* ]]; then exit 1; fi
              rpath=$(patchelf --print-rpath "$binary")
              if [[ "$rpath" == *"$RUNNER_TEMP"* || "$rpath" == *"$GITHUB_WORKSPACE"* ]]; then exit 1; fi
            fi
          done < <(find "$package_directory" -type f -print0)
          dpkg-query -W > "$RUNNER_TEMP/opencam-linux/evidence/ubuntu-package-versions.txt"
          mkdir "$package_directory/build-evidence"
          cp "$RUNNER_TEMP/opencam-linux/evidence/ffmpeg/config.mak" "$package_directory/build-evidence/ffmpeg-config.mak"
          cp "$RUNNER_TEMP/opencam-linux/evidence/elf-dependencies.txt" "$RUNNER_TEMP/opencam-linux/evidence/ubuntu-package-versions.txt" "$package_directory/build-evidence/"
          bash scripts/linux/package-verified-app.sh "$package_directory" "$RUNNER_TEMP/opencam-linux/artifacts" "$GITHUB_WORKSPACE/.linux-inputs/obs" "$GITHUB_WORKSPACE/.linux-inputs/ffmpeg" "$GITHUB_SHA"
      - name: Upload Linux development test package and corresponding sources (not Release)
        uses: actions/upload-artifact@v4
        with:
          name: OpenCam-v1.2.0-Ubuntu24.04-x64-Test-${{ github.sha }}
          path: |
            ${{ runner.temp }}/opencam-linux/artifacts/*.tar.gz
            ${{ runner.temp }}/opencam-linux/artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Preserve measured build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenCam-v1.2.0-Linux-App-Test-Logs-${{ github.sha }}
          path: ${{ runner.temp }}/opencam-linux/evidence/
          if-no-files-found: error
          retention-days: 14
