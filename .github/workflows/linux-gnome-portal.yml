# SPDX-License-Identifier: AGPL-3.0-or-later
name: Linux GNOME portal research
on:
  push:
    branches: ['codex/linux-app-test-20261030']
    paths: ['.github/workflows/linux-gnome-portal.yml', 'scripts/linux/test-gnome-portal.sh']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  gnome-portal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install isolated GNOME test desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-shell gnome-session-bin xdg-desktop-portal-gnome xdg-desktop-portal-gtk pipewire wireplumber dbus-x11 xvfb xauth xdotool scrot mesa-utils libx264-164 libxcb-xinput0 libwayland-egl1 pulseaudio-utils
      - name: Load immutable verified native preparation implementation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41215300661 --repo "$GITHUB_REPOSITORY" --name OpenCam-v1.2.0-Ubuntu24.04-x64-Test-f05020f62bd410d741e56be8ddc5340998664c21 --dir "$RUNNER_TEMP/inputs"
          cd "$RUNNER_TEMP/inputs"
          sha256sum --check SHA256SUMS.txt
          mkdir "$RUNNER_TEMP/app"
          tar -xzf OpenCam_v1.2.0_Ubuntu24.04_x64_Test_f05020f.tar.gz -C "$RUNNER_TEMP/app"
      - name: Exercise actual GNOME compositor and portal chooser
        env:
          OPENCAM_DISPOSABLE_CI_DESKTOP: '1'
        run: |
          mkdir "$RUNNER_TEMP/gnome-evidence"
          timeout 150 dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/linux/test-gnome-portal.sh "$RUNNER_TEMP/app/obs-runtime" "$RUNNER_TEMP/gnome-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GNOME-portal-research-${{ github.sha }}
          path: ${{ runner.temp }}/gnome-evidence
