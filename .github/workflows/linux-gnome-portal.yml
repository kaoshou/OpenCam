# SPDX-License-Identifier: AGPL-3.0-or-later
name: Linux GNOME portal research
on:
  push:
    branches: ['codex/linux-app-test-20261030']
    paths: ['.github/workflows/linux-gnome-portal.yml', 'scripts/linux/test-gnome-portal.sh', 'scripts/linux/gnome-chooser-fixture.py', 'scripts/linux/gnome-portal-recording-fixture.mjs']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  gnome-portal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: obsproject/obs-studio
          ref: 72e86655715d9a25d69ce446aa4dd44ba58e10d2
          path: .linux-inputs/obs
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install isolated GNOME test desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-shell gnome-session-bin xdg-desktop-portal-gnome xdg-desktop-portal-gtk pipewire wireplumber dbus-x11 xvfb xauth xdotool scrot mesa-utils libx264-164 libxcb-xinput0 libwayland-egl1 pulseaudio-utils at-spi2-core python3-pyatspi build-essential cmake extra-cmake-modules ninja-build pkg-config zlib1g-dev libsimde-dev uthash-dev libjansson-dev uuid-dev libx11-xcb-dev libxcb-xinput-dev libxkbcommon-dev libwayland-dev libdrm-dev libegl1-mesa-dev libpulse-dev libx264-dev libpipewire-0.3-dev libglib2.0-dev libxcb-composite0-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev libxcb-xinerama0-dev patchelf
      - uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/opencam-linux/ffmpeg-prefix
            ${{ runner.temp }}/opencam-linux/evidence/ffmpeg
          key: opencam-ubuntu24-x64-media-v1-${{ hashFiles('scripts/linux/build-app-media.sh') }}
          fail-on-cache-miss: true
      - name: Install isolated X11 test compositor
        run: sudo apt-get install -y --no-install-recommends picom openbox
      - name: Build actual X11 annotation UI probe
        run: |
          dotnet publish tests/ScreenRecorder.LinuxDesktopProbe -c Release -r linux-x64 --self-contained true -p:OpenCamNativeOnlyTest=true -m:1 -o "$RUNNER_TEMP/desktop-probe"
      - name: Exercise actual X11 annotation input and transparency (RED before adapter)
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/gnome-evidence"
          timeout 35 dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' sh -c 'openbox >/dev/null 2>&1 & picom --backend xrender >/dev/null 2>&1 & sleep 2; env XDG_SESSION_TYPE=x11 OPENCAM_DISPOSABLE_CI_DESKTOP=1 "$1/ScreenRecorder.LinuxDesktopProbe" "$2"' sh "$RUNNER_TEMP/desktop-probe" "$RUNNER_TEMP/gnome-evidence"
      - name: Build current native helper against unchanged pinned OBS
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/opencam-linux/ffmpeg-prefix/lib/pkgconfig
          LD_LIBRARY_PATH: ${{ runner.temp }}/opencam-linux/ffmpeg-prefix/lib
        run: |
          mkdir -p "$RUNNER_TEMP/gnome-evidence"
          bash scripts/linux/build-obs-probe.sh "$GITHUB_WORKSPACE/.linux-inputs/obs" "$RUNNER_TEMP/obs-build" "$RUNNER_TEMP/obs-stage" "$RUNNER_TEMP/gnome-evidence/obs" > "$RUNNER_TEMP/gnome-evidence/obs-build.log" 2>&1
          cmake -S native/obs-linux-probe -B "$RUNNER_TEMP/helper-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/obs-stage" -DOBS_SOURCE="$GITHUB_WORKSPACE/.linux-inputs/obs" -DOBS_RUNTIME="$RUNNER_TEMP/obs-stage" > "$RUNNER_TEMP/gnome-evidence/helper-configure.log" 2>&1
          cmake --build "$RUNNER_TEMP/helper-build" --parallel 2 > "$RUNNER_TEMP/gnome-evidence/helper-build.log" 2>&1
          cmake --install "$RUNNER_TEMP/helper-build" > "$RUNNER_TEMP/gnome-evidence/helper-install.log" 2>&1
      - name: Build actual managed IPC/private-client/engine acceptance probe
        run: |
          dotnet publish tests/ScreenRecorder.LinuxPortalProbe/ScreenRecorder.LinuxPortalProbe.csproj -c Release -r linux-x64 --self-contained true -p:OpenCamNativeOnlyTest=true -m:1 -o "$RUNNER_TEMP/portal-publish" > "$RUNNER_TEMP/gnome-evidence/managed-build.log" 2>&1
          node scripts/linux/assemble-app.mjs "$RUNNER_TEMP/portal-publish" "$RUNNER_TEMP/obs-stage" "$RUNNER_TEMP/opencam-linux/ffmpeg-prefix" "$RUNNER_TEMP/managed-portal" "$GITHUB_SHA" 1.2.0
      - name: Verify actual X11 global grabs and trigger counts before GNOME testing
        run: xvfb-run -a env XDG_SESSION_TYPE=x11 OPENCAM_DISPOSABLE_CI_DESKTOP=1 "$RUNNER_TEMP/managed-portal/OpenCam" --x11-hotkeys "$RUNNER_TEMP/gnome-evidence"
      - name: Verify X11 pointer pixels, hotspot and annotation input release
        if: success() || failure()
        run: xvfb-run -a env XDG_SESSION_TYPE=x11 OPENCAM_DISPOSABLE_CI_DESKTOP=1 "$RUNNER_TEMP/managed-portal/OpenCam" --x11-pointer "$RUNNER_TEMP/gnome-evidence"
      - name: Exercise actual GNOME compositor and portal chooser
        env:
          OPENCAM_DISPOSABLE_CI_DESKTOP: '1'
          LD_LIBRARY_PATH: ${{ runner.temp }}/obs-stage/lib:${{ runner.temp }}/opencam-linux/ffmpeg-prefix/lib
          OPENCAM_MANAGED_PORTAL_APP: ${{ runner.temp }}/managed-portal/OpenCam
        run: |
          timeout 150 dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/linux/test-gnome-portal.sh "$RUNNER_TEMP/obs-stage" "$RUNNER_TEMP/gnome-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GNOME-portal-research-${{ github.sha }}
          path: ${{ runner.temp }}/gnome-evidence
