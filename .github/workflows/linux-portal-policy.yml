# SPDX-License-Identifier: AGPL-3.0-or-later
name: Linux portal policy tests
on:
  push:
    branches: ['codex/linux-app-test-20261030']
    paths: ['native/obs-linux-probe/portal-*.hpp', 'native/obs-linux-probe/source-preview.hpp', 'tests/native/linux-portal-*.cpp', 'tests/native/linux-source-preview-tests.cpp', 'src/ScreenRecorder.Platform.Linux/LinuxPortal*.cs', 'tests/ScreenRecorder.Media.Tests/LinuxPortalPreparationTests.cs', '.github/workflows/linux-portal-policy.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  managed-portal:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run managed Linux source protocol and owned-process regression tests
        run: dotnet test tests/ScreenRecorder.Media.Tests/ScreenRecorder.Media.Tests.csproj --filter FullyQualifiedName~LinuxPortalPreparationTests -m:1
  portal-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install test compiler and actual GLib parser
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ pkg-config libglib2.0-dev
      - name: Compile and execute native grant and actual GVariant regression tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror tests/native/linux-portal-grant-tests.cpp -o "$RUNNER_TEMP/grant-tests"
          "$RUNNER_TEMP/grant-tests"
          c++ -std=c++17 -Wall -Wextra -Werror tests/native/linux-portal-response-tests.cpp $(pkg-config --cflags --libs gio-2.0) -o "$RUNNER_TEMP/response-tests"
          G_DEBUG=fatal-warnings "$RUNNER_TEMP/response-tests"
          c++ -std=c++17 -Wall -Wextra -Werror tests/native/linux-source-preview-tests.cpp -o "$RUNNER_TEMP/preview-tests"
          "$RUNNER_TEMP/preview-tests"
