# SPDX-License-Identifier: AGPL-3.0-or-later
name: Package OpenCam (manual)
on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Full source commit SHA authorized for packaging
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable source revision
        env:
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_REVISION" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: |
          node scripts/check-version-consistency.mjs
          dotnet restore ScreenRecorder.sln
          node scripts/check-nuget-vulnerabilities.mjs ScreenRecorder.sln
  build-obs:
    needs: verify-source
    uses: ./.github/workflows/verify-obs-core.yml
    with:
      release_package: true
        


