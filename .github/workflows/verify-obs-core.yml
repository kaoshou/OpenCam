# SPDX-License-Identifier: AGPL-3.0-or-later
# Independent development validation. No package-release, deployment or Release writes.
name: Verify pinned OBS recording core
on:
  workflow_call:
    inputs:
      release_package:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      release_package:
        description: Build official packages without publishing a Release
        type: boolean
        default: false
  push:
    branches: [codex/libobs-core-validation-20261025]
permissions:
  contents: read
jobs:
  obs-source-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/cache@v4
        id: source-cache
        with:
          path: |
            obs-sources/OBS-SOURCES.tar.gz
            obs-sources/OBS-SOURCES.json
          key: obs-source-${{ hashFiles('scripts/collect-obs-corresponding-sources.mjs', 'scripts/obs-corresponding-sources.lock.json') }}
      - name: Preserve pinned OBS dependency source recipes patches and recursive submodules
        if: steps.source-cache.outputs.cache-hit != 'true'
        run: node scripts/collect-obs-corresponding-sources.mjs obs-sources
      - uses: actions/upload-artifact@v4
        with:
          name: obs-corresponding-sources-${{ github.sha }}
          path: |
            obs-sources/OBS-SOURCES.tar.gz
            obs-sources/OBS-SOURCES.json
          if-no-files-found: error
          retention-days: 14
  windows-media-tools:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            make diffutils git patch
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-meson
      - uses: actions/cache@v4
        id: owned-tools-cache
        with:
          path: owned-media-tools
          key: owned-media-windows2022-${{ hashFiles('scripts/build-ffmpeg-windows.sh', 'scripts/windows-media-sources.lock.json', 'scripts/check-owned-media-tools.mjs', 'scripts/patches/**') }}
      - name: Build checksum-pinned Windows media tools and preserve source
        if: steps.owned-tools-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build-ffmpeg-windows.sh owned-media-tools
      - name: Verify owned tools and real MP4 GIF output
        run: node scripts/check-owned-media-tools.mjs owned-media-tools win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: owned-windows-media-${{ github.sha }}
          path: owned-media-tools/
          if-no-files-found: error
          retention-days: 14
  windows-core:
    needs: windows-media-tools
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        id: dotnet8
        with:
          dotnet-version: '8.0.x'
      - name: Select exact installed SDK for this validation
        shell: pwsh
        env:
          VALIDATION_DOTNET_SDK: ${{ steps.dotnet8.outputs.dotnet-version }}
        run: |
          if ($env:VALIDATION_DOTNET_SDK -notmatch '^8\.0\.\d+$') { throw 'Missing exact SDK 8 version.' }
          if (Test-Path global.json) { throw 'Repository SDK policy changed; review validation SDK selection.' }
          @{ sdk = @{ version = $env:VALIDATION_DOTNET_SDK; rollForward = 'disable'; allowPrerelease = $false } } | ConvertTo-Json -Depth 3 | Set-Content global.json -Encoding utf8
          if ((dotnet --version) -cne $env:VALIDATION_DOTNET_SDK) { throw 'Exact SDK selection failed.' }
      - name: Acquire official hash-pinned runtime and exact source revisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-obs-validation.mjs obs-inputs
      - uses: actions/download-artifact@v4
        with:
          name: owned-windows-media-${{ github.sha }}
          path: owned-media-tools
      - name: Use the owned media tools for core and package tests
        shell: pwsh
        run: |
          $bin = (Resolve-Path owned-media-tools).Path
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "OPENCAM_VALIDATION_FFMPEG=$bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Record validation environment
        run: node scripts/collect-test-environment.mjs obs-environment.json
      - name: Compile actual Windows helper and display-only module, then run native acceptance
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual C++ x64 toolchain unavailable.' }
          $dev = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          cmd /d /c "`"$dev`" -arch=x64 && pwsh -NoProfile -File scripts\verify-obs-core-windows.ps1 -InputDirectory obs-inputs -OutputDirectory obs-results -FFmpegDirectory `"$env:OPENCAM_VALIDATION_FFMPEG`""
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows core validation failed.' }
      - name: Test managed ownership, routing and actual synthetic core adapter
        shell: pwsh
        run: |
          dotnet test tests/ScreenRecorder.Core.Tests/ScreenRecorder.Core.Tests.csproj -c Release -m:1 /nodeReuse:false --filter 'FullyQualifiedName~SettingsServiceTests|FullyQualifiedName~IpcTests' --logger trx --results-directory obs-results/managed
          if ($LASTEXITCODE -ne 0) { throw 'First-launch/default settings tests failed.' }
          dotnet test tests/ScreenRecorder.Media.Tests/ScreenRecorder.Media.Tests.csproj -c Release -m:1 /nodeReuse:false --filter 'FullyQualifiedName~ScreenRecorder.Media.Tests.Obs|FullyQualifiedName~WindowsRecordingPrerequisitesTests|FullyQualifiedName~SettingsViewModelTests|FullyQualifiedName~ProjectMainEntryTests|FullyQualifiedName~TeachingPointerUiTests|FullyQualifiedName~RecordingContent|FullyQualifiedName~EmptyStartupFailure|FullyQualifiedName~StartupWithBytes|FullyQualifiedName~FailedResumePreserves|FullyQualifiedName~CustomRegionPreferencesTests|FullyQualifiedName~ProjectInspectorTests|FullyQualifiedName~RecordingCloseWarningLayoutTests|FullyQualifiedName~ProjectEditorChromeTests|FullyQualifiedName~WebPlayerExportTests' --logger trx --results-directory obs-results/managed
          if ($LASTEXITCODE -ne 0) { throw 'Managed OBS adapter tests failed.' }
      - name: Test explicit user-test runtime staging safeguards
        run: node --test tests/scripts/obs-user-test-package.test.mjs tests/scripts/third-party-notice-profile.test.mjs tests/web-player/player.test.mjs
      - name: Run full Windows regression using the owned media tools
        shell: pwsh
        run: |
          dotnet test ScreenRecorder.sln -c Release -m:1 /nodeReuse:false --logger trx --results-directory obs-results/full-managed
          if ($LASTEXITCODE -ne 0) { throw 'Owned media full Windows regression failed.' }
      - name: Publish Windows portable user-test application
        shell: pwsh
        run: |
          dotnet publish src/ScreenRecorder.UI/ScreenRecorder.UI.csproj -c Release -r win-x64 --self-contained true -p:OpenCamNativeOnlyTest=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o user-test-package
          if ($LASTEXITCODE -ne 0) { throw 'Windows user-test application publish failed.' }
          Copy-Item "$env:OPENCAM_VALIDATION_FFMPEG\ffmpeg.exe", "$env:OPENCAM_VALIDATION_FFMPEG\ffprobe.exe" user-test-package
          Copy-Item "$env:OPENCAM_VALIDATION_FFMPEG\ffmpeg-notices" user-test-package -Recurse
          # Full source archives have their own Release download; keep user packages compact.
          Get-ChildItem user-test-package/ffmpeg-notices/sources -File -Filter '*.archive' | Remove-Item
          Add-Content user-test-package/ffmpeg-notices/SOURCE-STATUS.txt "`nFull corresponding archives: Windows-Media-SOURCES.tar.gz on the matching OpenCam Release."
          Copy-Item LICENSE user-test-package/LICENSE
          Copy-Item NOTICE.md user-test-package/NOTICE.md
          $version = (Get-Content VERSION -Raw).Trim()
          @"
          OpenCam $version
          SPDX-License-Identifier: AGPL-3.0-or-later
          Corresponding source: https://github.com/kaoshou/OpenCam/tree/$env:GITHUB_SHA
          "@ | Set-Content user-test-package/SOURCE.txt -Encoding utf8
          node scripts/assemble-third-party-notices.mjs user-test-package win-x64 user-test-package/ffmpeg-notices src/ScreenRecorder.UI/obj/native-only/project.assets.json
          if ($LASTEXITCODE -ne 0) { throw 'User-test application notices failed.' }
          node scripts/prepare-obs-user-test-package.mjs obs-results/runtime user-test-package $env:GITHUB_SHA $version --enable-user-test-only --native-only
          if ($LASTEXITCODE -ne 0) { throw 'Explicit user-test runtime staging failed.' }
          Add-Content user-test-package/THIRD-PARTY-NOTICES.md "`n## OBS recording core`nAdditional full notices and corresponding sources: obs-runtime/licenses/SOURCE-INFO.md and obs-runtime/licenses/inventory.json."
          Copy-Item docs/testing/windows-obs-test.zh-TW.txt user-test-package/README-TEST.zh-TW.txt
          node scripts/check-release-notices.mjs user-test-package $env:GITHUB_SHA $version
          if ($LASTEXITCODE -ne 0) { throw 'User-test source/license verification failed.' }
          foreach ($name in @('OpenCam.exe','ffmpeg.exe','ffprobe.exe','obs-runtime/OpenCam.ObsCapture.exe')) {
            $path = Join-Path user-test-package $name
            if (!(Test-Path -LiteralPath $path -PathType Leaf) -or (Get-Item $path).Length -le 0) { throw "Missing packaged executable: $name" }
          }
          dotnet build tests/ScreenRecorder.NativeOnlyProbe/ScreenRecorder.NativeOnlyProbe.csproj -c Release -p:OpenCamNativeOnlyTest=true -m:1 /nodeReuse:false
          if ($LASTEXITCODE -ne 0) { throw 'Native-only policy probe build failed.' }
          dotnet tests/ScreenRecorder.NativeOnlyProbe/bin/native-only/Release/net8.0/ScreenRecorder.NativeOnlyProbe.dll user-test-package
          if ($LASTEXITCODE -ne 0) { throw 'Native-only assembly/runtime policy verification failed.' }
      - name: Verify actual packaged runtime through production loader and owned media output
        shell: pwsh
        run: |
          $env:OPENCAM_OBS_ENABLED_RUNTIME = (Resolve-Path user-test-package/obs-runtime).Path
          $env:OPENCAM_OBS_RUNTIME = $env:OPENCAM_OBS_ENABLED_RUNTIME
          $env:OPENCAM_OBS_HELPER = Join-Path $env:OPENCAM_OBS_RUNTIME 'OpenCam.ObsCapture.exe'
          dotnet test tests/ScreenRecorder.Media.Tests/ScreenRecorder.Media.Tests.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~ObsPackageDeploymentTests|FullyQualifiedName~ObsNativeAcceptanceTests' --logger trx --results-directory obs-results/packaged-managed
          if ($LASTEXITCODE -ne 0) { throw 'Actual packaged runtime validation failed.' }
          $name = "OpenCam_v$((Get-Content VERSION -Raw).Trim())_Windows_x64_NativeOnly_Test_$($env:GITHUB_SHA.Substring(0,7)).zip"
          Compress-Archive -Path user-test-package/* -DestinationPath $name
          Get-FileHash -LiteralPath $name -Algorithm SHA256 | ConvertTo-Json | Set-Content obs-results/user-test-zip-sha256.json -Encoding utf8
      - name: Assemble verified official Windows assets
        if: inputs.release_package
        shell: pwsh
        run: |
          node scripts/release-artifact-names.mjs | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ($LASTEXITCODE -ne 0) { throw 'Artifact names failed.' }
          $names = node scripts/release-artifact-names.mjs
          foreach ($line in $names) { $key,$value = $line -split '=',2; Set-Item "env:$key" $value }
          New-Item -ItemType Directory -Force installer/publish | Out-Null
          Copy-Item user-test-package/* installer/publish -Recurse
          Remove-Item installer/publish/OBS-TEST-INFO.json, installer/publish/README-TEST.zh-TW.txt
          Remove-Item installer/publish/obs-runtime -Recurse
          node scripts/prepare-obs-user-test-package.mjs obs-results/runtime installer/publish $env:GITHUB_SHA $env:OPENCAM_VERSION --enable-release --native-only
          if ($LASTEXITCODE -ne 0) { throw 'Official runtime staging failed.' }
          Copy-Item LICENSE installer/publish/LICENSE.txt
          node scripts/check-release-notices.mjs installer/publish $env:GITHUB_SHA $env:OPENCAM_VERSION --installer
          if ($LASTEXITCODE -ne 0) { throw 'Official notices failed.' }
          dotnet tests/ScreenRecorder.NativeOnlyProbe/bin/native-only/Release/net8.0/ScreenRecorder.NativeOnlyProbe.dll installer/publish
          if ($LASTEXITCODE -ne 0) { throw 'Official native-only policy failed.' }
          Compress-Archive -Path installer/publish/* -DestinationPath $env:WINDOWS_PORTABLE
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" "/DMyAppVersion=$env:OPENCAM_VERSION" installer/OpenCam.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer failed.' }
      - name: Upload official Windows installer and portable
        if: inputs.release_package
        uses: actions/upload-artifact@v4
        with:
          name: OpenCam-v${{ env.OPENCAM_VERSION }}-Windows-x64
          if-no-files-found: error
          path: |
            installer/Output/${{ env.WINDOWS_SETUP }}
            ${{ env.WINDOWS_PORTABLE }}
      - name: Upload Windows portable user-test ZIP (not a Release)
        if: ${{ !inputs.release_package }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenCam-Windows-NativeOnly-User-Test-${{ github.sha }}
          path: OpenCam_v*_Windows_x64_NativeOnly_Test_*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Preserve diagnostics and owned native build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obs-core-windows-evidence-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            obs-environment.json
            obs-inputs/acquisition.json
            obs-inputs/release-metadata.json
            obs-inputs/notices/
            obs-inputs/ffmpeg-source/libavutil/avconfig.h
            obs-results/*.json
            obs-results/*.log
            obs-results/native/
            obs-results/managed/
            obs-results/full-managed/
            obs-results/packaged-managed/
            obs-results/build/CMakeCache.txt
            obs-results/build/CMakeFiles/CMakeConfigureLog.yaml
            obs-results/build/Release/OpenCam.ObsCapture.exe
            obs-results/build/Release/OpenCam.ObsCapture.pdb
            obs-results/build/Release/win-capture.dll
            obs-results/build/Release/win-capture.pdb
  macos-package:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Acquire checksum-pinned Apple Silicon runtime and sources
        run: bash scripts/prepare-obs-macos-validation.sh "$RUNNER_TEMP/obs-inputs"
      - name: Build owned OBS helper and stage verified runtime
        run: |
          bash scripts/build-obs-capture.sh "$RUNNER_TEMP/obs-inputs/obs-source" "$RUNNER_TEMP/obs-inputs/OBS.app" "$RUNNER_TEMP/obs-inputs/ffmpeg-source" "$RUNNER_TEMP/obs-inputs/simde-source" "$RUNNER_TEMP/obs-build" "$RUNNER_TEMP/obs-runtime" third-party/obs-runtime
          cmake --build "$RUNNER_TEMP/obs-build" --target OpenCam.ObsDisplayTests --parallel 2
          "$RUNNER_TEMP/obs-build/OpenCam.ObsDisplayTests"
      - name: Publish OBS-only macOS application
        run: dotnet publish src/ScreenRecorder.UI/ScreenRecorder.UI.csproj -c Release -r osx-arm64 --self-contained true -p:OpenCamNativeOnlyTest=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o "$RUNNER_TEMP/publish"
      - name: Build self-contained preview and export tools
        run: bash scripts/build-ffmpeg-macos-arm64.sh "$RUNNER_TEMP/publish"
      - name: Preserve exact macOS media-tool sources independently
        run: tar -czf macOS-Media-SOURCES.tar.gz -C "$RUNNER_TEMP/publish" ffmpeg-notices
      - uses: actions/upload-artifact@v4
        with:
          name: macos-media-sources-${{ github.sha }}
          path: macOS-Media-SOURCES.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Package and validate macOS application
        run: |
          find "$RUNNER_TEMP/publish/ffmpeg-notices/sources" -type f \( -name '*.tar.gz' -o -name '*.tar.xz' \) -delete
          printf '\nFull corresponding archives: macOS-Media-SOURCES.tar.gz on the matching OpenCam Release.\n' > "$RUNNER_TEMP/publish/ffmpeg-notices/SOURCE-STATUS.txt"
          profile=--native-only-user-test
          if [ "${{ inputs.release_package }}" = true ]; then profile=--native-only-release; fi
          bash scripts/package-macos.sh "$RUNNER_TEMP/publish" "$RUNNER_TEMP/bundle/OpenCam.app" Release "$profile" "$RUNNER_TEMP/obs-runtime"
          node scripts/check-release-notices.mjs "$RUNNER_TEMP/bundle/OpenCam.app/Contents/Resources" "$GITHUB_SHA" "$(cat VERSION)"
          dotnet build tests/ScreenRecorder.NativeOnlyProbe/ScreenRecorder.NativeOnlyProbe.csproj -c Release -p:OpenCamNativeOnlyTest=true -m:1 /nodeReuse:false
          PATH="$RUNNER_TEMP/bundle/OpenCam.app/Contents/MacOS:$PATH" dotnet tests/ScreenRecorder.NativeOnlyProbe/bin/native-only/Release/net8.0/ScreenRecorder.NativeOnlyProbe.dll "$RUNNER_TEMP/bundle/OpenCam.app/Contents/MacOS"
          codesign --verify --deep --strict "$RUNNER_TEMP/bundle/OpenCam.app"
          name="OpenCam_v$(cat VERSION)_macOS_arm64_Test_${GITHUB_SHA:0:7}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/bundle/OpenCam.app" "$name"
          shasum -a 256 "$name" > "$name.sha256"
      - name: Create official macOS disk image
        if: inputs.release_package
        run: |
          node scripts/release-artifact-names.mjs >> "$GITHUB_ENV"
          eval "$(node scripts/release-artifact-names.mjs)"
          mkdir -p "$RUNNER_TEMP/dmg-release"
          ditto "$RUNNER_TEMP/bundle/OpenCam.app" "$RUNNER_TEMP/dmg-release/OpenCam.app"
          ln -s /Applications "$RUNNER_TEMP/dmg-release/Applications"
          for attempt in 1 2 3; do
            if hdiutil create -volname OpenCam -srcfolder "$RUNNER_TEMP/dmg-release" -ov -format UDZO "$MACOS_DMG"; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 5
          done
          hdiutil verify "$MACOS_DMG"
      - name: Upload official macOS disk image
        if: inputs.release_package
        uses: actions/upload-artifact@v4
        with:
          name: OpenCam-v${{ env.OPENCAM_VERSION }}-macOS-arm64
          if-no-files-found: error
          path: ${{ env.MACOS_DMG }}
      - name: Upload macOS Apple Silicon test application (not a Release)
        if: ${{ !inputs.release_package }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenCam-macOS-arm64-User-Test-${{ github.sha }}
          path: |
            OpenCam_v*_macOS_arm64_Test_*.zip
            OpenCam_v*_macOS_arm64_Test_*.zip.sha256
          if-no-files-found: error
          retention-days: 14
  managed-portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        id: dotnet8
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Ubuntu FFmpeg test prerequisites
        if: runner.os == 'Linux'
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then exit 0; fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg
      - name: Install macOS FFmpeg test prerequisites
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Select exact installed SDK for this portable validation
        shell: pwsh
        env:
          VALIDATION_DOTNET_SDK: ${{ steps.dotnet8.outputs.dotnet-version }}
        run: |
          if ($env:VALIDATION_DOTNET_SDK -notmatch '^8\.0\.\d+$') { throw 'Missing exact SDK 8 version.' }
          if (Test-Path global.json) { throw 'Repository SDK policy changed; review validation SDK selection.' }
          @{ sdk = @{ version = $env:VALIDATION_DOTNET_SDK; rollForward = 'disable'; allowPrerelease = $false } } | ConvertTo-Json -Depth 3 | Set-Content global.json -Encoding utf8
          if ((dotnet --version) -cne $env:VALIDATION_DOTNET_SDK) { throw 'Exact SDK selection failed.' }
      - name: Record bounded portable FFmpeg and SDK versions
        run: node scripts/collect-test-environment.mjs obs-managed-results/environment.json
      - name: Test managed OBS contracts and native display identity
        run: |
          dotnet test tests/ScreenRecorder.Core.Tests/ScreenRecorder.Core.Tests.csproj -c Release -m:1 /nodeReuse:false --filter 'FullyQualifiedName~SettingsServiceTests' --logger trx --results-directory obs-managed-results
          dotnet test tests/ScreenRecorder.Media.Tests/ScreenRecorder.Media.Tests.csproj -c Release -m:1 /nodeReuse:false --filter '(FullyQualifiedName~ScreenRecorder.Media.Tests.Obs&FullyQualifiedName!~ObsNativeAcceptanceTests)|FullyQualifiedName~RecordingDisplayIdentityTests' --logger trx --results-directory obs-managed-results
      - name: Preserve portable managed diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obs-core-managed-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: obs-managed-results/
          retention-days: 7
          if-no-files-found: warn
