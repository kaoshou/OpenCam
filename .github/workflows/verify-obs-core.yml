# SPDX-License-Identifier: AGPL-3.0-or-later
# Independent development validation. No package-release, deployment or Release writes.
name: Verify pinned OBS recording core
on:
  workflow_dispatch:
  push:
    branches: [codex/libobs-core-validation-20261025]
permissions:
  contents: read
jobs:
  windows-core:
    if: github.ref == 'refs/heads/codex/libobs-core-validation-20261025'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        id: dotnet8
        with:
          dotnet-version: '8.0.x'
      - name: Select exact installed SDK for this validation
        shell: pwsh
        env:
          VALIDATION_DOTNET_SDK: ${{ steps.dotnet8.outputs.dotnet-version }}
        run: |
          if ($env:VALIDATION_DOTNET_SDK -notmatch '^8\.0\.\d+$') { throw 'Missing exact SDK 8 version.' }
          if (Test-Path global.json) { throw 'Repository SDK policy changed; review validation SDK selection.' }
          @{ sdk = @{ version = $env:VALIDATION_DOTNET_SDK; rollForward = 'disable'; allowPrerelease = $false } } | ConvertTo-Json -Depth 3 | Set-Content global.json -Encoding utf8
          if ((dotnet --version) -cne $env:VALIDATION_DOTNET_SDK) { throw 'Exact SDK selection failed.' }
      - name: Acquire official hash-pinned runtime and exact source revisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-obs-validation.mjs obs-inputs
      - name: Install pinned FFmpeg decoding test tools
        shell: pwsh
        run: |
          $bin = & .\scripts\install-windows-ffmpeg.ps1 -Destination "$env:RUNNER_TEMP\opencam-obs-test-ffmpeg"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "OPENCAM_VALIDATION_FFMPEG=$bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Record validation environment
        run: node scripts/collect-test-environment.mjs obs-environment.json
      - name: Compile actual Windows helper and display-only module, then run native acceptance
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual C++ x64 toolchain unavailable.' }
          $dev = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          cmd /d /c "`"$dev`" -arch=x64 && pwsh -NoProfile -File scripts\verify-obs-core-windows.ps1 -InputDirectory obs-inputs -OutputDirectory obs-results -FFmpegDirectory `"$env:OPENCAM_VALIDATION_FFMPEG`""
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows core validation failed.' }
      - name: Test managed ownership, routing and actual synthetic core adapter
        shell: pwsh
        run: |
          dotnet test tests/ScreenRecorder.Core.Tests/ScreenRecorder.Core.Tests.csproj -c Release -m:1 /nodeReuse:false --filter 'FullyQualifiedName~SettingsServiceTests' --logger trx --results-directory obs-results/managed
          if ($LASTEXITCODE -ne 0) { throw 'First-launch/default settings tests failed.' }
          dotnet test tests/ScreenRecorder.Media.Tests/ScreenRecorder.Media.Tests.csproj -c Release -m:1 /nodeReuse:false --filter 'FullyQualifiedName~ScreenRecorder.Media.Tests.Obs|FullyQualifiedName~SettingsViewModelTests|FullyQualifiedName~ProjectMainEntryTests|FullyQualifiedName~TeachingPointerUiTests' --logger trx --results-directory obs-results/managed
          if ($LASTEXITCODE -ne 0) { throw 'Managed OBS adapter tests failed.' }
      - name: Test explicit user-test runtime staging safeguards
        run: node --test tests/scripts/obs-user-test-package.test.mjs tests/scripts/third-party-notice-profile.test.mjs
      - name: Publish Windows portable user-test application
        shell: pwsh
        run: |
          dotnet publish src/ScreenRecorder.UI/ScreenRecorder.UI.csproj -c Release -r win-x64 --self-contained true -p:OpenCamNativeOnlyTest=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o user-test-package
          if ($LASTEXITCODE -ne 0) { throw 'Windows user-test application publish failed.' }
          Copy-Item "$env:OPENCAM_VALIDATION_FFMPEG\ffmpeg.exe", "$env:OPENCAM_VALIDATION_FFMPEG\ffprobe.exe" user-test-package
          Copy-Item "$env:OPENCAM_VALIDATION_FFMPEG\ffmpeg-notices" user-test-package -Recurse
          Copy-Item LICENSE user-test-package/LICENSE
          Copy-Item NOTICE.md user-test-package/NOTICE.md
          $version = (Get-Content VERSION -Raw).Trim()
          @"
          OpenCam $version
          SPDX-License-Identifier: AGPL-3.0-or-later
          Corresponding source: https://github.com/kaoshou/OpenCam/tree/$env:GITHUB_SHA
          "@ | Set-Content user-test-package/SOURCE.txt -Encoding utf8
          node scripts/assemble-third-party-notices.mjs user-test-package win-x64 user-test-package/ffmpeg-notices src/ScreenRecorder.UI/obj/native-only/project.assets.json
          if ($LASTEXITCODE -ne 0) { throw 'User-test application notices failed.' }
          node scripts/prepare-obs-user-test-package.mjs obs-results/runtime user-test-package $env:GITHUB_SHA $version --enable-user-test-only --native-only
          if ($LASTEXITCODE -ne 0) { throw 'Explicit user-test runtime staging failed.' }
          Add-Content user-test-package/THIRD-PARTY-NOTICES.md "`n## User-test recording core`nAdditional full notices and corresponding sources: obs-runtime/licenses/SOURCE-INFO.md and obs-runtime/licenses/inventory.json."
          Copy-Item docs/testing/windows-obs-test.zh-TW.txt user-test-package/README-TEST.zh-TW.txt
          node scripts/check-release-notices.mjs user-test-package $env:GITHUB_SHA $version
          if ($LASTEXITCODE -ne 0) { throw 'User-test source/license verification failed.' }
          foreach ($name in @('OpenCam.exe','ffmpeg.exe','ffprobe.exe','obs-runtime/OpenCam.ObsCapture.exe')) {
            $path = Join-Path user-test-package $name
            if (!(Test-Path -LiteralPath $path -PathType Leaf) -or (Get-Item $path).Length -le 0) { throw "Missing packaged executable: $name" }
          }
          dotnet build tests/ScreenRecorder.NativeOnlyProbe/ScreenRecorder.NativeOnlyProbe.csproj -c Release -p:OpenCamNativeOnlyTest=true -m:1 /nodeReuse:false
          if ($LASTEXITCODE -ne 0) { throw 'Native-only policy probe build failed.' }
          dotnet tests/ScreenRecorder.NativeOnlyProbe/bin/native-only/Release/net8.0/ScreenRecorder.NativeOnlyProbe.dll user-test-package
          if ($LASTEXITCODE -ne 0) { throw 'Native-only assembly/runtime policy verification failed.' }
      - name: Verify actual packaged runtime through production loader and owned media output
        shell: pwsh
        run: |
          $env:OPENCAM_OBS_ENABLED_RUNTIME = (Resolve-Path user-test-package/obs-runtime).Path
          $env:OPENCAM_OBS_RUNTIME = $env:OPENCAM_OBS_ENABLED_RUNTIME
          $env:OPENCAM_OBS_HELPER = Join-Path $env:OPENCAM_OBS_RUNTIME 'OpenCam.ObsCapture.exe'
          dotnet test tests/ScreenRecorder.Media.Tests/ScreenRecorder.Media.Tests.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~ObsPackageDeploymentTests|FullyQualifiedName~ObsNativeAcceptanceTests' --logger trx --results-directory obs-results/packaged-managed
          if ($LASTEXITCODE -ne 0) { throw 'Actual packaged runtime validation failed.' }
          $name = "OpenCam_v$((Get-Content VERSION -Raw).Trim())_Windows_x64_NativeOnly_Test_$($env:GITHUB_SHA.Substring(0,7)).zip"
          Compress-Archive -Path user-test-package/* -DestinationPath $name
          Get-FileHash -LiteralPath $name -Algorithm SHA256 | ConvertTo-Json | Set-Content obs-results/user-test-zip-sha256.json -Encoding utf8
      - name: Upload Windows portable user-test ZIP (not a Release)
        uses: actions/upload-artifact@v4
        with:
          name: OpenCam-Windows-NativeOnly-User-Test-${{ github.sha }}
          path: OpenCam_v*_Windows_x64_NativeOnly_Test_*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Preserve diagnostics and owned native build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obs-core-windows-evidence-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            obs-environment.json
            obs-inputs/acquisition.json
            obs-inputs/release-metadata.json
            obs-inputs/notices/
            obs-inputs/ffmpeg-source/libavutil/avconfig.h
            obs-results/*.json
            obs-results/*.log
            obs-results/native/
            obs-results/managed/
            obs-results/packaged-managed/
            obs-results/build/CMakeCache.txt
            obs-results/build/CMakeFiles/CMakeConfigureLog.yaml
            obs-results/build/Release/OpenCam.ObsCapture.exe
            obs-results/build/Release/OpenCam.ObsCapture.pdb
            obs-results/build/Release/win-capture.dll
            obs-results/build/Release/win-capture.pdb
  macos-package:
    if: github.ref == 'refs/heads/codex/libobs-core-validation-20261025'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Acquire checksum-pinned Apple Silicon runtime and sources
        run: bash scripts/prepare-obs-macos-validation.sh "$RUNNER_TEMP/obs-inputs"
      - name: Build owned OBS helper and stage verified runtime
        run: |
          bash scripts/build-obs-capture.sh "$RUNNER_TEMP/obs-inputs/obs-source" "$RUNNER_TEMP/obs-inputs/OBS.app" "$RUNNER_TEMP/obs-inputs/ffmpeg-source" "$RUNNER_TEMP/obs-inputs/simde-source" "$RUNNER_TEMP/obs-build" "$RUNNER_TEMP/obs-runtime" third-party/obs-runtime
          cmake --build "$RUNNER_TEMP/obs-build" --target OpenCam.ObsDisplayTests --parallel 2
          "$RUNNER_TEMP/obs-build/OpenCam.ObsDisplayTests"
      - name: Publish OBS-only macOS application
        run: dotnet publish src/ScreenRecorder.UI/ScreenRecorder.UI.csproj -c Release -r osx-arm64 --self-contained true -p:OpenCamNativeOnlyTest=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o "$RUNNER_TEMP/publish"
      - name: Build self-contained preview and export tools
        run: bash scripts/build-ffmpeg-macos-arm64.sh "$RUNNER_TEMP/publish"
      - name: Package and validate macOS application
        run: |
          bash scripts/package-macos.sh "$RUNNER_TEMP/publish" "$RUNNER_TEMP/bundle/OpenCam.app" Release --native-only-user-test "$RUNNER_TEMP/obs-runtime"
          node scripts/check-release-notices.mjs "$RUNNER_TEMP/bundle/OpenCam.app/Contents/Resources" "$GITHUB_SHA" "$(cat VERSION)"
          dotnet build tests/ScreenRecorder.NativeOnlyProbe/ScreenRecorder.NativeOnlyProbe.csproj -c Release -p:OpenCamNativeOnlyTest=true -m:1 /nodeReuse:false
          dotnet tests/ScreenRecorder.NativeOnlyProbe/bin/native-only/Release/net8.0/ScreenRecorder.NativeOnlyProbe.dll "$RUNNER_TEMP/bundle/OpenCam.app/Contents/MacOS"
          codesign --verify --deep --strict "$RUNNER_TEMP/bundle/OpenCam.app"
          name="OpenCam_v$(cat VERSION)_macOS_arm64_Test_${GITHUB_SHA:0:7}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/bundle/OpenCam.app" "$name"
          shasum -a 256 "$name" > "$name.sha256"
      - name: Upload macOS Apple Silicon test application (not a Release)
        uses: actions/upload-artifact@v4
        with:
          name: OpenCam-macOS-arm64-User-Test-${{ github.sha }}
          path: |
            OpenCam_v*_macOS_arm64_Test_*.zip
            OpenCam_v*_macOS_arm64_Test_*.zip.sha256
          if-no-files-found: error
          retention-days: 14
  managed-portable:
    if: github.ref == 'refs/heads/codex/libobs-core-validation-20261025'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        id: dotnet8
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Ubuntu FFmpeg test prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install macOS FFmpeg test prerequisites
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Select exact installed SDK for this portable validation
        shell: pwsh
        env:
          VALIDATION_DOTNET_SDK: ${{ steps.dotnet8.outputs.dotnet-version }}
        run: |
          if ($env:VALIDATION_DOTNET_SDK -notmatch '^8\.0\.\d+$') { throw 'Missing exact SDK 8 version.' }
          if (Test-Path global.json) { throw 'Repository SDK policy changed; review validation SDK selection.' }
          @{ sdk = @{ version = $env:VALIDATION_DOTNET_SDK; rollForward = 'disable'; allowPrerelease = $false } } | ConvertTo-Json -Depth 3 | Set-Content global.json -Encoding utf8
          if ((dotnet --version) -cne $env:VALIDATION_DOTNET_SDK) { throw 'Exact SDK selection failed.' }
      - name: Record bounded portable FFmpeg and SDK versions
        run: node scripts/collect-test-environment.mjs obs-managed-results/environment.json
      - name: Test managed OBS contracts and native display identity
        run: |
          dotnet test tests/ScreenRecorder.Core.Tests/ScreenRecorder.Core.Tests.csproj -c Release -m:1 /nodeReuse:false --filter 'FullyQualifiedName~SettingsServiceTests' --logger trx --results-directory obs-managed-results
          dotnet test tests/ScreenRecorder.Media.Tests/ScreenRecorder.Media.Tests.csproj -c Release -m:1 /nodeReuse:false --filter '(FullyQualifiedName~ScreenRecorder.Media.Tests.Obs&FullyQualifiedName!~ObsNativeAcceptanceTests)|FullyQualifiedName~RecordingDisplayIdentityTests' --logger trx --results-directory obs-managed-results
      - name: Preserve portable managed diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obs-core-managed-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: obs-managed-results/
          retention-days: 7
          if-no-files-found: warn
