window.addEventListener('DOMContentLoaded',()=>{
  const video=document.getElementById('video'),error=document.getElementById('error'),data=window.OpenCamPlayerData;

    const button=document.createElement('button');button.type='button';button.className='chapter';
    const number=document.createElement('span');number.className='number';number.textContent=String(index+1).padStart(2,'0');
    const copy=document.createElement('span'),title=document.createElement('span'),times=document.createElement('span');
    copy.className='copy';title.className='title';title.textContent=chapter.title;title.title=chapter.title;times.className='times';
    const start=document.createElement('span'),duration=document.createElement('span'),length=Math.max(0,chapter.end-chapter.start);
    start.textContent='▶ '+time(chapter.start);start.title='起始時間 / Start time';
    duration.textContent='◷ '+(length>0&&length<1?'<0:01':time(length));duration.title='片段總時間 / Chapter duration';
    button.setAttribute('aria-label',chapter.title+' · '+start.title+' '+time(chapter.start)+' · '+duration.title+' '+(length>0&&length<1?'<0:01':time(length)));

  const stage=document.getElementById('stage'),controls=document.getElementById('controls'),seek=document.getElementById('seek'),
    play=document.getElementById('play'),mute=document.getElementById('mute'),volume=document.getElementById('volume'),
    speed=document.getElementById('speed'),wide=document.getElementById('wide'),fullscreen=document.getElementById('fullscreen');
  let hideTimer,fullscreenPending=false;
  const captionButton=document.getElementById('caption-button'),captionMenu=document.getElementById('caption-menu'),
    captionLanguage=document.getElementById('caption-language'),captionOverlay=document.getElementById('caption-overlay'),
    captionText=document.getElementById('caption-text'),captionSize=document.getElementById('caption-size'),
    captionTheme=document.getElementById('caption-theme'),captionOpacity=document.getElementById('caption-opacity'),captionPosition=document.getElementById('caption-position');
  const showControls=()=>{
    window.clearTimeout(hideTimer);stage.classList.remove('controls-hidden');
    if(!video.paused&&!video.ended)hideTimer=window.setTimeout(()=>{
      if(!video.paused&&!video.ended&&captionMenu.hidden&&!controls.contains(document.activeElement))stage.classList.add('controls-hidden');
    },3000);
  };
  const validDuration=()=>Number.isFinite(video.duration)&&video.duration>0;
  const sourceTracks=data.subtitles?.tracks;
  const subtitleTracks=Array.isArray(sourceTracks)&&sourceTracks.length<=32?sourceTracks.filter(track=>
    track&&typeof track.id==='string'&&track.id.length>0&&track.id.length<=128&&track.id!=='off'&&typeof track.label==='string'&&
    typeof track.language==='string'&&Array.isArray(track.cues)&&track.cues.length>0&&track.cues.length<=100000&&
    track.cues.every(c=>c&&Number.isFinite(c.start)&&Number.isFinite(c.end)&&c.start>=0&&c.end>c.start&&typeof c.text==='string'&&c.text.length<=10000)):[];

    if(!query){element.textContent=text;return;}
    const lower=text.toLowerCase();let offset=0,index;
    while((index=lower.indexOf(query,offset))>=0){
      const before=document.createElement('span'),match=document.createElement('mark');
      before.textContent=text.slice(offset,index);match.textContent=text.slice(index,index+query.length);element.append(before,match);offset=index+query.length;
    }
    const tail=document.createElement('span');tail.textContent=text.slice(offset);element.append(tail);
  };
  const drawTranscript=()=>{
    transcriptList.replaceChildren();transcriptRows=[];
    const query=transcriptSearch.value.trim().toLowerCase();
    const end=Math.min(transcriptMatches.length,transcriptStart+transcriptLimit);
    for(let i=transcriptStart;i<end;i++){
      const cue=transcriptMatches[i],row=document.createElement('button'),stamp=document.createElement('span'),copy=document.createElement('span');
      row.type='button';row.className='transcript-row';stamp.className='transcript-time';stamp.textContent=time(cue.start);
      copy.className='transcript-copy';highlightText(copy,cue.text,query);row.append(stamp,copy);
      row.addEventListener('click',()=>{if(video.readyState<1)pending=cue.start;else video.currentTime=cue.start;update(cue.start);renderCaptions();syncTime();syncTranscript();});
      transcriptList.append(row);transcriptRows.push({row,cue});
    }
    transcriptMore.hidden=end>=transcriptMatches.length;
    transcriptStatus.textContent=!subtitleTracks.length?'請先附加字幕 / No subtitles attached':
      (query?'搜尋結果 ':'字幕 ')+transcriptMatches.length+' · '+(end?transcriptStart+1:0)+'–'+end;
  };
  const searchTranscript=()=>{
    const query=transcriptSearch.value.trim().toLowerCase();
    transcriptMatches=query?transcriptCues.filter(c=>c.text.toLowerCase().includes(query)):transcriptCues;
    transcriptStart=0;transcriptLimit=100;lastFollow=-1;drawTranscript();syncTranscript();
  };
  const syncTranscript=()=>{
    const position=video.currentTime;
    // Latest-started cue, using an ordered index rather than walking every DOM row/cue.
    let low=0,high=transcriptCues.length;
    while(low<high){const middle=(low+high)>>1;if(transcriptCues[middle].start<=position)low=middle+1;else high=middle;}
    const active=low-1;
    if(transcriptFollow.checked&&!transcriptSearch.value.trim()&&!document.getElementById('transcript-panel').hidden&&active>=0&&active!==lastFollow){
      if(active<transcriptStart||active>=transcriptStart+transcriptLimit){transcriptStart=Math.floor(active/100)*100;transcriptLimit=100;drawTranscript();}
      transcriptRows.find(r=>r.cue===transcriptCues[active])?.row.scrollIntoView?.({block:'nearest',behavior:'auto'});lastFollow=active;
    }
    transcriptRows.forEach(({row,cue})=>row.setAttribute('aria-current',String(!video.ended&&position>=cue.start&&position<cue.end)));
  };
  const setTranscriptLanguage=()=>{
    window.clearTimeout(searchTimer);
    transcriptCues=[...(subtitleTracks.find(t=>t.id===transcriptLanguage.value)?.cues||[])].sort((a,b)=>a.start-b.start);
    searchTranscript();
  };
  subtitleTracks.forEach(t=>{const option=document.createElement('option');option.value=t.id;option.textContent=subtitleLanguageLabel(t);transcriptLanguage.append(option)});
  transcriptLanguage.value=defaultTrack?.id||'';transcriptLanguage.disabled=transcriptSearch.disabled=transcriptFollow.disabled=!subtitleTracks.length;
  const showIndex=transcript=>{
    syncSidebarHeight();
    document.getElementById('chapter-panel').hidden=transcript;document.getElementById('transcript-panel').hidden=!transcript;
    chapterTab.setAttribute('aria-selected',String(!transcript));transcriptTab.setAttribute('aria-selected',String(transcript));
    chapterTab.tabIndex=transcript?-1:0;transcriptTab.tabIndex=transcript?0:-1;lastFollow=-1;syncTranscript();
  };
  chapterTab.addEventListener('click',()=>showIndex(false));transcriptTab.addEventListener('click',()=>showIndex(true));
  [chapterTab,transcriptTab].forEach(tab=>tab.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const next=tab===chapterTab;showIndex(next);(next?transcriptTab:chapterTab).focus?.();}
  }));
  transcriptLanguage.addEventListener('change',setTranscriptLanguage);
  transcriptSearch.addEventListener('input',()=>{window.clearTimeout(searchTimer);searchTimer=window.setTimeout(searchTranscript,120)});
  transcriptMore.addEventListener('click',()=>{transcriptLimit+=100;drawTranscript();syncTranscript()});
  transcriptFollow.addEventListener('change',()=>{lastFollow=-1;syncTranscript()});
  ['timeupdate','seeked','loadedmetadata','ended'].forEach(event=>video.addEventListener(event,syncTranscript));
  const preference=readPref(choiceKey);
  let subtitleId=preference==='off'||subtitleTracks.some(t=>t.id===preference)?preference:defaultTrack?.id||'off';
  let appearance={size:100,theme:0,opacity:.78,position:'bottom'},captionFrame=null,captionFrameNative=false;
  try{const saved=JSON.parse(readPref('opencam.captionAppearance')||'null');if(saved){
    if(Number.isFinite(saved.size)&&saved.size>=75&&saved.size<=200)appearance.size=saved.size;
    if([0,1,2,3].includes(saved.theme))appearance.theme=saved.theme;
    if(Number.isFinite(saved.opacity)&&saved.opacity>=0&&saved.opacity<=1)appearance.opacity=saved.opacity;
    if(['top','middle','bottom'].includes(saved.position))appearance.position=saved.position;
  }}catch{}
  const renderCaptions=()=>{
    const track=subtitleTracks.find(t=>t.id===subtitleId),position=video.currentTime;
    const text=track&&!video.ended?track.cues.filter(c=>position>=c.start&&position<c.end).map(c=>c.text).join('\n'):'';
    captionText.textContent=text;captionOverlay.hidden=text.length===0;
  };
  const cancelCaptionFrame=()=>{
    if(captionFrame!==null){if(captionFrameNative)video.cancelVideoFrameCallback?.(captionFrame);else window.cancelAnimationFrame?.(captionFrame);captionFrame=null;}
  };
  const scheduleCaptions=()=>{
    if(video.paused||video.ended||subtitleId==='off')return;
    if(video.requestVideoFrameCallback){captionFrameNative=true;captionFrame=video.requestVideoFrameCallback(()=>{renderCaptions();scheduleCaptions()});}
    else if(window.requestAnimationFrame){captionFrameNative=false;captionFrame=window.requestAnimationFrame(()=>{renderCaptions();scheduleCaptions()});}
  };
  const setSubtitle=id=>{
    subtitleId=subtitleTracks.some(t=>t.id===id)?id:'off';captionLanguage.value=subtitleId;
    captionButton.setAttribute('aria-pressed',String(subtitleId!=='off'));writePref(choiceKey,subtitleId);
    cancelCaptionFrame();renderCaptions();scheduleCaptions();showControls();
  };
  const applyCaptionAppearance=()=>{
    captionSize.value=String(appearance.size);document.getElementById('caption-size-value').textContent=appearance.size+'%';
    captionTheme.value=String(appearance.theme);captionOpacity.value=String(appearance.opacity);captionPosition.value=appearance.position;
    captionText.style.fontSize=appearance.size+'%';captionText.style.color=appearance.theme===1?'#ffe45c':appearance.theme===2?'#111':'#fff';
    captionText.style.backgroundColor=appearance.theme===3?'transparent':appearance.theme===2?'rgba(255,255,255,'+appearance.opacity+')':'rgba(0,0,0,'+appearance.opacity+')';
    captionText.style.textShadow=appearance.theme===2?'none':'0 1px 3px #000,1px 0 2px #000,-1px 0 2px #000';
    captionOverlay.dataset.position=appearance.position;writePref('opencam.captionAppearance',JSON.stringify(appearance));showControls();
  };
  const closeCaptionMenu=()=>{captionMenu.hidden=true;captionButton.setAttribute('aria-expanded','false');showControls()};
  if(subtitleTracks.length){
    captionButton.hidden=false;
    const off=document.createElement('option');off.value='off';off.textContent='關閉字幕 / Off';captionLanguage.append(off);
    subtitleTracks.forEach(track=>{const option=document.createElement('option');option.value=track.id;option.textContent=subtitleLanguageLabel(track);captionLanguage.append(option)});
    setSubtitle(subtitleId);applyCaptionAppearance();
  }
  captionButton.addEventListener('click',()=>{captionMenu.hidden=!captionMenu.hidden;captionButton.setAttribute('aria-expanded',String(!captionMenu.hidden));if(!captionMenu.hidden)captionLanguage.focus?.();showControls()});
  captionLanguage.addEventListener('change',()=>setSubtitle(captionLanguage.value));
  captionSize.addEventListener('input',()=>{const value=Number(captionSize.value);appearance.size=Number.isFinite(value)?Math.max(75,Math.min(200,value)):100;applyCaptionAppearance()});
  captionTheme.addEventListener('change',()=>{const value=Number(captionTheme.value);appearance.theme=[0,1,2,3].includes(value)?value:0;applyCaptionAppearance()});
  captionOpacity.addEventListener('input',()=>{const value=Number(captionOpacity.value);appearance.opacity=Number.isFinite(value)?Math.max(0,Math.min(1,value)):.78;applyCaptionAppearance()});
  captionPosition.addEventListener('change',()=>{appearance.position=['top','middle','bottom'].includes(captionPosition.value)?captionPosition.value:'bottom';applyCaptionAppearance()});
  document.getElementById('caption-reset').addEventListener('click',()=>{appearance={size:100,theme:0,opacity:.78,position:'bottom'};applyCaptionAppearance()});
  ['timeupdate','seeked','loadedmetadata','pause','ended'].forEach(event=>video.addEventListener(event,renderCaptions));
  video.addEventListener('play',()=>{cancelCaptionFrame();renderCaptions();scheduleCaptions()});
  ['pause','ended'].forEach(event=>video.addEventListener(event,cancelCaptionFrame));
  stage.addEventListener('pointerdown',e=>{if(!captionMenu.hidden&&e.target!==captionButton&&!captionMenu.contains(e.target)&&!captionButton.contains(e.target))closeCaptionMenu()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!captionMenu.hidden){e.preventDefault();closeCaptionMenu();captionButton.focus?.()}});
  const syncTime=()=>{
    document.getElementById('current-time').textContent=time(video.currentTime);
    document.getElementById('total-time').textContent=validDuration()?time(video.duration):'0:00';
    seek.disabled=!validDuration();seek.value=String(validDuration()?Math.min(100,video.currentTime/video.duration*100):0);
    seek.setAttribute('aria-valuetext',time(video.currentTime)+' / '+(validDuration()?time(video.duration):'0:00'));
  };
  const syncPlay=()=>{play.classList.toggle('playing',!video.paused&&!video.ended);play.setAttribute('aria-label',video.paused?'播放 / Play':'暫停 / Pause');showControls()};
  const togglePlay=()=>{if(video.paused||video.ended)video.play().catch(()=>{showControls();showError('無法開始播放，請再按播放或確認影片檔案。 Unable to start playback.');});else video.pause()};
  const syncVolume=()=>{volume.value=String(video.volume);mute.setAttribute('aria-pressed',String(video.muted||video.volume===0));
    mute.setAttribute('aria-label',video.muted||video.volume===0?'開啟聲音 / Unmute':'靜音 / Mute');mute.title=video.muted||video.volume===0?'開啟聲音 / Unmute':'靜音 / Mute'};
  const syncFullscreen=()=>{if(document.fullscreenElement===stage){stage.classList.remove('frame-fullscreen');document.body.classList.remove('frame-fullscreen-active');}
    const active=document.fullscreenElement===stage||stage.classList.contains('frame-fullscreen');
    fullscreen.setAttribute('aria-pressed',String(active));fullscreen.setAttribute('aria-label',active?'離開全螢幕 / Exit full screen':'全螢幕 / Full screen');showControls()};
  const exitFrame=()=>{stage.classList.remove('frame-fullscreen');document.body.classList.remove('frame-fullscreen-active');syncFullscreen()};
  const enterFrame=()=>{stage.classList.add('frame-fullscreen');document.body.classList.add('frame-fullscreen-active');syncFullscreen()};
  const toggleFullscreen=async()=>{
    if(fullscreenPending)return;
    if(stage.classList.contains('frame-fullscreen')){exitFrame();return;}
    fullscreenPending=true;
    try{if(document.fullscreenElement===stage)await document.exitFullscreen();
      else if(stage.requestFullscreen)await stage.requestFullscreen();else enterFrame();}
    catch{if(document.fullscreenElement!==stage)enterFrame();else showControls();}
    finally{fullscreenPending=false;syncFullscreen();}
  };
  play.addEventListener('click',togglePlay);
  seek.addEventListener('input',()=>{if(validDuration()){video.currentTime=Math.max(0,Math.min(100,Number(seek.value)))/100*video.duration;syncTime();update();}showControls()});
  mute.addEventListener('click',()=>{if(video.volume===0){video.volume=1;video.muted=false;}else video.muted=!video.muted;syncVolume();showControls()});
  volume.addEventListener('input',()=>{video.volume=Math.max(0,Math.min(1,Number(volume.value)));video.muted=false;syncVolume();showControls()});
  speed.addEventListener('change',()=>{video.playbackRate=Number(speed.value);showControls()});
  video.addEventListener('ratechange',()=>{speed.value=String(video.playbackRate)});
  wide.addEventListener('click',()=>{const active=document.getElementById('layout').classList.toggle('wide');wide.setAttribute('aria-pressed',String(active));wide.title=active?'還原版面 / Restore layout':'寬螢幕 / Wide screen';showControls()});
  fullscreen.addEventListener('click',toggleFullscreen);document.addEventListener('fullscreenchange',syncFullscreen);
  document.addEventListener('keydown',e=>{if(!e.defaultPrevented&&e.key==='Escape'&&stage.classList.contains('frame-fullscreen'))exitFrame()});
  stage.addEventListener('keydown',e=>{
    if(e.target!==stage&&e.target!==video)return;
    if(e.key===' '){e.preventDefault();togglePlay();}
    else if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&validDuration()){e.preventDefault();video.currentTime=Math.max(0,Math.min(video.duration,video.currentTime+(e.key==='ArrowLeft'?-5:5)));syncTime();update();}
    else if(e.key==='f'||e.key==='F'){e.preventDefault();toggleFullscreen();}showControls();
  });
  ['pointermove','pointerdown','focusin','focusout'].forEach(event=>stage.addEventListener(event,showControls));
  ['play','pause','ended'].forEach(event=>video.addEventListener(event,syncPlay));
  ['timeupdate','seeked','loadedmetadata','durationchange'].forEach(event=>video.addEventListener(event,syncTime));
  video.addEventListener('volumechange',syncVolume);
  setTranscriptLanguage();showIndex(false);syncTime();syncPlay();syncVolume();update();stage.classList.add('enhanced');video.controls=false;
});
</script>
</body>
