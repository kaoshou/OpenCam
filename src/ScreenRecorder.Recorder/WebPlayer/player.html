<script>
window.addEventListener('DOMContentLoaded',()=>{
  const video=document.getElementById('video'),error=document.getElementById('error'),data=window.OpenCamPlayerData;
  const showError=text=>{error.textContent=text;error.hidden=false};
  if(!data||data.format!=='opencam.web-player'||data.schemaVersion!==1||!Array.isArray(data.chapters)){showError('播放器資料無法載入，請確認 opencam-player.js 與 index.html 放在同一個資料夾。 Player data is missing.');return;}
  const time=seconds=>{seconds=Math.max(0,Math.floor(seconds));const h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),s=String(seconds%60).padStart(2,'0');return h?h+':'+String(m).padStart(2,'0')+':'+s:m+':'+s};
  document.getElementById('title').textContent=data.title;
  document.getElementById('summary').textContent='影片總長度 '+time(data.chapters.at(-1)?.end||0)+' · '+data.chapters.length+' 章節 / chapters · OpenCam';
  let pending=null;const buttons=[];
  data.chapters.forEach((chapter,index)=>{
    const button=document.createElement('button');button.type='button';button.className='chapter';
    const number=document.createElement('span');number.className='number';number.textContent=String(index+1).padStart(2,'0');
    const copy=document.createElement('span'),title=document.createElement('span'),times=document.createElement('span');
    copy.className='copy';title.className='title';title.textContent=chapter.title;title.title=chapter.title;times.className='times';
    const start=document.createElement('span'),duration=document.createElement('span'),length=Math.max(0,chapter.end-chapter.start);
    start.textContent='▶ '+time(chapter.start);start.title='起始時間 / Start time';
    duration.textContent='◷ '+(length>0&&length<1?'<0:01':time(length));duration.title='片段總時間 / Chapter duration';
    button.setAttribute('aria-label',chapter.title+' · '+start.title+' '+time(chapter.start)+' · '+duration.title+' '+(length>0&&length<1?'<0:01':time(length)));
    times.append(start,duration);copy.append(title,times);button.append(number,copy);
    button.addEventListener('click',()=>{if(video.readyState<1)pending=chapter.start;else video.currentTime=chapter.start;video.play().catch(()=>{});update(chapter.start)});
    document.getElementById('chapters').append(button);buttons.push(button);
  });
  const update=(position=video.currentTime)=>{let active=-1;data.chapters.forEach((c,i)=>{if(position>=c.start)active=i});buttons.forEach((b,i)=>b.setAttribute('aria-current',String(i===active)));if(active>=0)document.getElementById('now').textContent=data.chapters[active].title};
  video.addEventListener('loadedmetadata',()=>{if(pending!==null){video.currentTime=pending;pending=null}update()});
  video.addEventListener('timeupdate',()=>update());video.addEventListener('seeked',()=>update());
  video.addEventListener('error',()=>showError('影片無法播放，請確認 media.mp4 與網頁放在同一個資料夾，或改用支援 H.264／AAC 的瀏覽器。 Unable to play media.mp4.'));
  const stage=document.getElementById('stage'),controls=document.getElementById('controls'),seek=document.getElementById('seek'),
    play=document.getElementById('play'),mute=document.getElementById('mute'),volume=document.getElementById('volume'),
    speed=document.getElementById('speed'),wide=document.getElementById('wide'),fullscreen=document.getElementById('fullscreen');
  let hideTimer,fullscreenPending=false;
  const showControls=()=>{
    window.clearTimeout(hideTimer);stage.classList.remove('controls-hidden');
    if(!video.paused&&!video.ended)hideTimer=window.setTimeout(()=>{
      if(!video.paused&&!video.ended&&!controls.contains(document.activeElement))stage.classList.add('controls-hidden');
    },3000);
  };
  const validDuration=()=>Number.isFinite(video.duration)&&video.duration>0;
  const syncTime=()=>{
    document.getElementById('current-time').textContent=time(video.currentTime);
    document.getElementById('total-time').textContent=validDuration()?time(video.duration):'0:00';
    seek.disabled=!validDuration();seek.value=String(validDuration()?Math.min(100,video.currentTime/video.duration*100):0);
    seek.setAttribute('aria-valuetext',time(video.currentTime)+' / '+(validDuration()?time(video.duration):'0:00'));
  };
  const syncPlay=()=>{play.classList.toggle('playing',!video.paused&&!video.ended);play.setAttribute('aria-label',video.paused?'播放 / Play':'暫停 / Pause');showControls()};
  const togglePlay=()=>{if(video.paused||video.ended)video.play().catch(()=>{showControls();showError('無法開始播放，請再按播放或確認影片檔案。 Unable to start playback.');});else video.pause()};
  const syncVolume=()=>{volume.value=String(video.volume);mute.setAttribute('aria-pressed',String(video.muted||video.volume===0));
    mute.setAttribute('aria-label',video.muted||video.volume===0?'開啟聲音 / Unmute':'靜音 / Mute');mute.title=video.muted||video.volume===0?'開啟聲音 / Unmute':'靜音 / Mute'};
  const syncFullscreen=()=>{if(document.fullscreenElement===stage){stage.classList.remove('frame-fullscreen');document.body.classList.remove('frame-fullscreen-active');}
    const active=document.fullscreenElement===stage||stage.classList.contains('frame-fullscreen');
    fullscreen.setAttribute('aria-pressed',String(active));fullscreen.setAttribute('aria-label',active?'離開全螢幕 / Exit full screen':'全螢幕 / Full screen');showControls()};
  const exitFrame=()=>{stage.classList.remove('frame-fullscreen');document.body.classList.remove('frame-fullscreen-active');syncFullscreen()};
  const enterFrame=()=>{stage.classList.add('frame-fullscreen');document.body.classList.add('frame-fullscreen-active');syncFullscreen()};
  const toggleFullscreen=async()=>{
    if(fullscreenPending)return;
    if(stage.classList.contains('frame-fullscreen')){exitFrame();return;}
    fullscreenPending=true;
    try{if(document.fullscreenElement===stage)await document.exitFullscreen();
      else if(stage.requestFullscreen)await stage.requestFullscreen();else enterFrame();}
    catch{if(document.fullscreenElement!==stage)enterFrame();else showControls();}
    finally{fullscreenPending=false;syncFullscreen();}
  };
  play.addEventListener('click',togglePlay);
  seek.addEventListener('input',()=>{if(validDuration()){video.currentTime=Math.max(0,Math.min(100,Number(seek.value)))/100*video.duration;syncTime();update();}showControls()});
  mute.addEventListener('click',()=>{if(video.volume===0){video.volume=1;video.muted=false;}else video.muted=!video.muted;syncVolume();showControls()});
  volume.addEventListener('input',()=>{video.volume=Math.max(0,Math.min(1,Number(volume.value)));video.muted=false;syncVolume();showControls()});
  speed.addEventListener('change',()=>{video.playbackRate=Number(speed.value);showControls()});
  video.addEventListener('ratechange',()=>{speed.value=String(video.playbackRate)});
  wide.addEventListener('click',()=>{const active=document.getElementById('layout').classList.toggle('wide');wide.setAttribute('aria-pressed',String(active));wide.title=active?'還原版面 / Restore layout':'寬螢幕 / Wide screen';showControls()});
  fullscreen.addEventListener('click',toggleFullscreen);document.addEventListener('fullscreenchange',syncFullscreen);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&stage.classList.contains('frame-fullscreen'))exitFrame()});
  stage.addEventListener('keydown',e=>{
    if(e.target!==stage&&e.target!==video)return;
    if(e.key===' '){e.preventDefault();togglePlay();}
    else if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&validDuration()){e.preventDefault();video.currentTime=Math.max(0,Math.min(video.duration,video.currentTime+(e.key==='ArrowLeft'?-5:5)));syncTime();update();}
    else if(e.key==='f'||e.key==='F'){e.preventDefault();toggleFullscreen();}showControls();
  });
  ['pointermove','pointerdown','focusin','focusout'].forEach(event=>stage.addEventListener(event,showControls));
  ['play','pause','ended'].forEach(event=>video.addEventListener(event,syncPlay));
  ['timeupdate','seeked','loadedmetadata','durationchange'].forEach(event=>video.addEventListener(event,syncTime));
  video.addEventListener('volumechange',syncVolume);
  syncTime();syncPlay();syncVolume();update();stage.classList.add('enhanced');video.controls=false;
});
</script>
